# =====================================================================
# CẤU HÌNH ỨNG DỤNG QUẢN LÝ WEBSITE BÁN LAPTOP (QL_LAPTOP)
# Nền tảng: IntelliJ IDEA + JDK 17 + Microsoft SQL Server
# =====================================================================

server.port=${SERVER_PORT:8080}

# Kết nối Microsoft SQL Server (chạy được trên mọi máy qua biến môi trường hoặc sửa trực tiếp password bên dưới)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QL_Laptop;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA giữ nguyên tên bảng và cột PascalCase như file database/QL_LAPTOP.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Thymeleaf UTF-8
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Cổng Socket Server (Thành viên 2)
laptop.socket.enabled=true
laptop.socket.port=${SOCKET_PORT:9090}

# =====================================================================
# CẤU HÌNH MỞ RỘNG PHASE 2 - Cửa hàng, Thanh toán, Upload
# =====================================================================

# Thông tin cửa hàng (hiển thị trên header, footer, báo cáo doanh thu, trang chính sách).
# Slogan, địa chỉ, giờ làm việc có giá trị mặc định tiếng Việt trong ShopProperties.java
# (muốn đổi: thêm laptop.shop.address=... bằng chuỗi unicode \uXXXX hoặc sửa trực tiếp ShopProperties).
laptop.shop.name=NEXORA LAPTOP
laptop.shop.phone=0901 234 567
laptop.shop.email=cskh@nexoralaptop.vn

# Cấu hình thanh toán chuyển khoản (VietQR)
laptop.payment.bank-bin=970422
laptop.payment.bank-name=MB Bank
laptop.payment.account-number=0123456789
laptop.payment.account-name=NEXORA LAPTOP
laptop.payment.expire-minutes=30

# Thư mục lưu ảnh minh chứng thanh toán
laptop.upload.payment-proof-dir=uploads/payment-proofs
laptop.upload.max-proof-size-bytes=5242880

# Upload file tối đa 5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Kích hoạt @Scheduled
spring.task.scheduling.enabled=true

# Hỗ trợ reverse proxy HTTPS (Cloudflare Tunnel / Reverse Proxy)
server.forward-headers-strategy=framework

# Tự động tạo link HTTPS toàn cầu (quét QR từ 4G/5G/mọi Wi-Fi, không cần chỉnh Firewall)
laptop.qr.tunnel-enabled=${QR_TUNNEL_ENABLED:true}
laptop.qr.base-url=${QR_BASE_URL:}
