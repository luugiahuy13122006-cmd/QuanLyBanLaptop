# =====================================================================
# CẤU HÌNH ỨNG DỤNG QUẢN LÝ WEBSITE BÁN LAPTOP (QL_LAPTOP)
# Nền tảng: IntelliJ IDEA + JDK 17 + Microsoft SQL Server
# =====================================================================

server.port=${SERVER_PORT:8080}

# Kết nối Microsoft SQL Server (chạy được trên mọi máy qua biến môi trường hoặc sửa trực tiếp password bên dưới)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QL_Laptop;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YOUR_SQL_SERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA giữ nguyên tên bảng và cột PascalCase như file database/QL_LAPTOP.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Thymeleaf UTF-8
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Cấu hình upload tệp ảnh sản phẩm (5 ảnh / laptop)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Cổng Socket Server (Thành viên 2)
laptop.socket.enabled=true
laptop.socket.port=${SOCKET_PORT:9090}
