# =====================================================================
# CẤU HÌNH CHUNG (NEXORA LAPTOP) - Không chứa mật khẩu mặc định trong git
# Thiết lập biến môi trường DB_USERNAME, DB_PASSWORD (hoặc tạo application-dev.properties cục bộ)
# =====================================================================
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Múi giờ Việt Nam
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Kết nối Microsoft SQL Server qua biến môi trường
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QL_Laptop;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA giữ nguyên tên bảng và cột PascalCase như file database/QL_LAPTOP.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.open-in-view=false

# Thymeleaf UTF-8 & i18n
spring.thymeleaf.encoding=UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Session Cookie bảo mật
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m

# Cổng Socket Server (Thành viên 2)
laptop.socket.enabled=${SOCKET_ENABLED:true}
laptop.socket.port=${SOCKET_PORT:9090}
laptop.socket.auth-token=${SOCKET_AUTH_TOKEN:NEXORA_SOCKET_DEV_TOKEN_2026}

# Thông tin cửa hàng (NEXORA LAPTOP)
laptop.shop.name=NEXORA LAPTOP
laptop.shop.phone=0901 234 567
laptop.shop.email=cskh@nexoralaptop.vn

# Thanh toán chuyển khoản & bảo mật QR / Webhook
laptop.payment.mode=${PAYMENT_MODE:DEMO}
laptop.payment.bank-bin=970422
laptop.payment.bank-name=MB Bank
laptop.payment.account-number=0123456789
laptop.payment.account-name=NEXORA LAPTOP
laptop.payment.expire-minutes=30
laptop.qr.hmac-secret=${QR_HMAC_SECRET:}
laptop.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}

# Thư mục lưu ảnh minh chứng thanh toán & sản phẩm
laptop.upload.payment-proof-dir=uploads/payment-proofs
laptop.upload.max-proof-size-bytes=5242880

# Upload file tối đa 5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Scheduler pool riêng (tránh blocking giữa các @Scheduled job)
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=4

# Hỗ trợ reverse proxy HTTPS
server.forward-headers-strategy=framework
laptop.qr.tunnel-enabled=${QR_TUNNEL_ENABLED:false}
laptop.qr.base-url=${QR_BASE_URL:}

# Email (Dev log console; Prod cấu hình SMTP thật)
laptop.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
