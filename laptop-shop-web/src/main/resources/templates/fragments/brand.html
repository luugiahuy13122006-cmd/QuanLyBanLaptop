<!DOCTYPE html>
<!-- Nhận diện thương hiệu NEXORA LAPTOP: logo (mark) + lockup dùng chung cho header, footer, admin, đăng nhập, báo cáo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Biểu tượng logo: màn hình laptop + chữ N + đèn nguồn xanh. Truyền kích thước px: ~{fragments/brand :: mark(40)} -->
<span th:fragment="mark(size)" class="nx-mark" th:style="'--nx-size:' + ${size} + 'px'" aria-hidden="true">
  <svg viewBox="0 0 64 64" focusable="false">
    <rect x="14" y="16" width="36" height="25" rx="5" fill="none" stroke="#fff" stroke-width="3.2"/>
    <path class="nx-n" d="M22 35V22l20 13V22" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 47h46" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    <circle class="nx-dot" cx="50" cy="16" r="4.5" fill="#67E8F9" stroke="#fff" stroke-width="2"/>
  </svg>
</span>

<!-- Lockup đầy đủ: logo + wordmark. Tham số: dark (nền tối), tagline (chữ nhỏ), home (đường dẫn khi bấm) -->
<a th:fragment="lockup(dark, tagline, home)" class="nx-lockup" th:classappend="${dark} ? 'is-dark'"
   th:href="@{${home}}" aria-label="Nexora Laptop - Trang chủ">
  <span th:replace="~{fragments/brand :: mark(40)}"></span>
  <span class="lh-1">
    <span class="nx-word">NEX<em>ORA</em></span>
    <span class="nx-tag" th:text="${tagline}">Laptop Chính Hãng</span>
  </span>
</a>

</body>
</html>
