<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="commonHead(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} + ' | ' + (${shop?.name ?: 'NEXORA LAPTOP'})">NEXORA LAPTOP</title>
  <meta name="description" th:content="${shop?.slogan ?: 'NEXORA LAPTOP - Laptop chính hãng, bảo hành uy tín, thanh toán VietQR & COD'}"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" th:content="${pageTitle} + ' | NEXORA LAPTOP'"/>
  <link rel="manifest" th:href="@{/manifest.json}"/>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/laptop-default.svg}"/>

  <!-- Anti-flash Dark/Light init before first paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nexora-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Offline-first Vendor CSS with CDN onerror fallback -->
  <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css';"/>
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css';"/>
  <link rel="stylesheet" th:href="@{/vendor/fonts/fonts.css}"/>

  <!-- Modular Design System -->
  <link rel="stylesheet" th:href="@{/css/tokens.css}"/>
  <link rel="stylesheet" th:href="@{/css/base.css}"/>
  <link rel="stylesheet" th:href="@{/css/components.css}"/>
  <link rel="stylesheet" th:href="@{/css/pages/storefront.css}"/>
</head>
</html>
