<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đơn hàng của tôi - LaptopShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="h4 fw-bold mb-0 d-flex align-items-center gap-2">
      <span class="pro-kpi-icon pro-kpi-icon-blue" style="width: 36px; height: 36px; font-size: 1rem;">
        <i class="bi bi-bag-check"></i>
      </span>
      Lịch sử đơn hàng của tôi
    </h2>
    <a th:href="@{/}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Tiếp tục mua sắm</a>
  </div>

  <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

  <div th:if="${#lists.isEmpty(orders)}" class="pro-card p-5 text-center">
    <div class="pro-kpi-icon pro-kpi-icon-slate mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
      <i class="bi bi-receipt"></i>
    </div>
    <h5 class="fw-bold mb-1">Chưa có đơn hàng nào</h5>
    <p class="text-muted small mb-3">Bạn chưa đặt đơn hàng nào tại LaptopShop.</p>
    <a th:href="@{/}" class="btn btn-pv-primary px-4">Mua sắm ngay</a>
  </div>

  <div class="pro-card" th:if="${!#lists.isEmpty(orders)}">
    <div class="table-responsive">
      <table class="table pro-table align-middle mb-0">
        <thead>
          <tr>
            <th>Mã đơn</th>
            <th>Ngày đặt</th>
            <th>Sản phẩm</th>
            <th>Thanh toán</th>
            <th class="text-end">Tổng tiền</th>
            <th class="text-center">Trạng thái</th>
            <th class="text-center">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="o : ${orders}">
            <td>
              <a th:href="@{/don-hang-cua-toi/{id}(id=${o.id})}" class="fw-bold font-mono text-decoration-none text-primary" th:text="${o.orderCode}"></a>
            </td>
            <td class="small text-muted tabular-nums" th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <div th:each="d : ${o.details}" class="small">
                <span class="fw-medium" th:text="${d.laptopNameSnapshot}"></span>
                <span class="text-muted"> x <strong class="text-dark" th:text="${d.quantity}"></strong></span>
              </div>
            </td>
            <td class="small">
              <div class="fw-medium mb-1" th:text="${o.paymentMethod.displayName}"></div>
              <span class="badge-soft"
                    th:classappend="${o.paymentStatus.name() == 'PAID' ? 'badge-soft-success' : (o.paymentStatus.name() == 'PENDING_CONFIRMATION' ? 'badge-soft-warning' : (o.paymentStatus.name() == 'FAILED' or o.paymentStatus.name() == 'REFUNDED' ? 'badge-soft-danger' : 'badge-soft-slate'))}"
                    th:text="${o.paymentStatus.displayName}"></span>
            </td>
            <td class="text-end pv-price text-nowrap tabular-nums"
                th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
            <td class="text-center">
              <span class="badge-soft"
                    th:classappend="${o.status.name() == 'COMPLETED' ? 'badge-soft-success' : (o.status.name() == 'CANCELLED' or o.status.name() == 'RETURNED' or o.status.name() == 'REFUNDED' ? 'badge-soft-danger' : (o.status.name() == 'REFUND_REQUESTED' ? 'badge-soft-indigo' : 'badge-soft-warning'))}"
                    th:text="${o.status.displayName}"></span>
            </td>
            <td class="text-center text-nowrap">
              <a th:href="@{/don-hang-cua-toi/{id}(id=${o.id})}" class="btn btn-sm btn-pv-outline">Chi tiết</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
