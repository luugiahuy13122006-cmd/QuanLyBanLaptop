<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Đơn hàng của tôi')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h2 class="h4 fw-bold mb-0"><i class="bi bi-bag-check text-primary me-2"></i>Đơn hàng của tôi
      <span class="badge bg-primary bg-opacity-10 text-primary ms-1" th:text="${allOrderCount ?: orders.size()}">0</span>
    </h2>
    <a th:href="@{/}" class="btn btn-outline-primary btn-sm"><i class="bi bi-shop me-1"></i>Tiếp tục mua sắm</a>
  </div>
  <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

  <form th:action="@{/don-hang-cua-toi}" method="get" class="nx-filter-bar p-3 mb-4 row g-2 align-items-end">
    <div class="col-md-5">
      <label class="form-label small fw-semibold mb-1">Tìm theo mã đơn</label>
      <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="VD: DH001..."/>
    </div>
    <div class="col-md-4">
      <label class="form-label small fw-semibold mb-1">Trạng thái</label>
      <select name="status" class="form-select form-select-sm">
        <option value="">Tất cả trạng thái</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == selectedStatus}"></option>
      </select>
    </div>
    <div class="col-md-3 d-flex gap-2">
      <button type="submit" class="btn btn-pv-primary btn-sm flex-grow-1">Tìm kiếm</button>
      <a th:href="@{/don-hang-cua-toi}" class="btn btn-outline-secondary btn-sm">Đặt lại</a>
    </div>
  </form>

  <div th:if="${orders.empty}" class="nx-filter-bar text-center py-5">
    <i class="bi bi-inbox display-4 text-muted mb-3 d-block"></i>
    <h5 class="fw-bold">Chưa có đơn hàng nào</h5>
    <a th:href="@{/}" class="btn btn-pv-primary mt-2 px-4">Mua sắm ngay</a>
  </div>

  <div class="nx-filter-bar p-0 overflow-hidden" th:if="${!orders.empty}">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Mã đơn</th><th>Ngày đặt</th><th>Thanh toán</th><th>Trạng thái</th><th class="text-end">Tổng tiền</th><th class="text-end">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="o : ${orders}">
            <td><code class="fw-bold text-primary" th:text="${o.orderCode}"></code></td>
            <td class="small tabular-nums" th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="small">
              <span th:text="${o.paymentMethod.displayName}"></span>
              <span class="badge bg-success bg-opacity-10 text-success ms-1" th:if="${o.paymentStatus.name() == 'PAID'}">Đã TT</span>
            </td>
            <td><span class="badge bg-primary bg-opacity-10 text-primary" th:text="${o.status.displayName}"></span></td>
            <td class="text-end fw-bold text-primary tabular-nums" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
            <td class="text-end text-nowrap">
              <a th:href="@{/don-hang-cua-toi/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary">Chi tiết</a>
              <a th:href="@{/don-hang-cua-toi/{id}/hoa-don(id=${o.id})}" class="btn btn-sm btn-outline-secondary" title="Hóa đơn"><i class="bi bi-printer"></i></a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <nav th:if="${totalPages != null and totalPages > 1}" class="d-flex justify-content-end mt-3">
    <ul class="pagination pagination-sm nx-pagination mb-0">
      <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
        <a class="page-link" th:href="@{/don-hang-cua-toi(page=${i}, keyword=${keyword}, status=${selectedStatus})}" th:text="${i + 1}">1</a>
      </li>
    </ul>
  </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
