<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Thông báo lỗi - LaptopShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container py-5 text-center">
  <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
  <h2 class="mt-3" th:text="${errorTitle ?: 'Đã xảy ra lỗi'}">Đã xảy ra lỗi</h2>
  <p class="text-muted" th:text="${errorMessage ?: 'Vui lòng kiểm tra lại thao tác và thử lại.'}"></p>
  <div class="d-flex justify-content-center gap-2 mt-3">
    <a href="javascript:history.back()" class="btn btn-outline-secondary">Quay lại</a>
    <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Về trang chủ</a>
  </div>
</div>
</body>
</html>
