<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Thông báo lỗi - Nexora Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/brand/nexora-mark.svg}"/>
  <link th:href="@{/css/nexora.css}" rel="stylesheet"/>
  <script>document.documentElement.classList.add('nx-js')</script>
  <script th:src="@{/js/nexora.js}" defer></script>
</head>
<body class="pro-auth-bg d-flex align-items-center min-vh-100">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="pro-auth-card p-5 text-center">
        <div class="pro-kpi-icon pro-kpi-icon-rose mx-auto mb-3" style="width: 68px; height: 68px; font-size: 2rem;">
          <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h2 class="h4 fw-bold mt-2" th:text="${errorTitle ?: 'Đã xảy ra lỗi'}">Đã xảy ra lỗi</h2>
        <p class="text-muted small mb-4" th:text="${errorMessage ?: 'Vui lòng kiểm tra lại thao tác và thử lại.'}"></p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <a href="javascript:history.back()" class="btn btn-outline-secondary px-3"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
          <a th:href="@{/}" class="btn btn-pv-primary px-4"><i class="bi bi-house me-1"></i>Về trang chủ</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
