<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Thông báo hệ thống')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main id="mainContent" class="container py-5 text-center" style="max-width: 640px;">
  <div class="nx-filter-bar p-5">
    <i class="bi bi-exclamation-octagon display-2 text-danger mb-3 d-block"></i>
    <h1 class="h3 fw-bold mb-2" th:text="${errorTitle ?: 'Có lỗi xảy ra'}">Lỗi hệ thống</h1>
    <p class="text-muted mb-4" th:text="${errorMessage ?: 'Vui lòng thử lại sau.'}"></p>
    <div class="d-flex justify-content-center gap-2">
      <button type="button" onclick="history.back()" class="btn btn-outline-secondary px-3">Quay lại</button>
      <a th:href="@{/}" class="btn btn-pv-primary px-4">Về trang chủ</a>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
