<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('403 - Không có quyền truy cập')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main id="mainContent" class="container py-5 text-center" style="max-width: 600px;">
  <div class="nx-filter-bar p-5">
    <i class="bi bi-shield-x display-2 text-danger mb-3 d-block"></i>
    <h1 class="h3 fw-bold mb-2" th:text="${errorTitle ?: '403 - Không có quyền truy cập'}">403</h1>
    <p class="text-muted mb-4" th:text="${errorMessage ?: 'Tài khoản của bạn không được phép truy cập khu vực này.'}"></p>
    <a th:href="@{/}" class="btn btn-pv-primary px-4">Về trang chủ</a>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
