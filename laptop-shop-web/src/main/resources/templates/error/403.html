<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>403 - Không có quyền truy cập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container py-5 text-center">
  <div class="display-1 fw-bold text-warning">403</div>
  <h2 class="mt-2" th:text="${errorTitle ?: 'Không có quyền truy cập'}">403 - Không có quyền truy cập</h2>
  <p class="text-muted" th:text="${errorMessage ?: 'Tài khoản của bạn không được phép truy cập chức năng này.'}"></p>
  <div class="d-flex justify-content-center gap-2 mt-3">
    <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Về trang chủ</a>
    <a th:href="@{/login}" class="btn btn-outline-secondary">Đăng nhập tài khoản khác</a>
  </div>
</div>
</body>
</html>
