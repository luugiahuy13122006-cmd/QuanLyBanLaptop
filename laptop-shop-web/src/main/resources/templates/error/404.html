<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('404 - Không tìm thấy trang')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main id="mainContent" class="container py-5 text-center" style="max-width: 600px;">
  <div class="nx-filter-bar p-5">
    <i class="bi bi-compass display-2 text-warning mb-3 d-block"></i>
    <h1 class="h3 fw-bold mb-2" th:text="${errorTitle ?: '404 - Không tìm thấy trang'}">404</h1>
    <p class="text-muted mb-4" th:text="${errorMessage ?: 'Liên kết bạn truy cập không tồn tại hoặc dữ liệu đã thay đổi.'}"></p>
    <a th:href="@{/}" class="btn btn-pv-primary px-4">Về trang chủ</a>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
