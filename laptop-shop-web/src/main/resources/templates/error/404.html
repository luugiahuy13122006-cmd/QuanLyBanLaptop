<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>404 - Không tìm thấy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container py-5 text-center">
  <div class="display-1 fw-bold text-secondary">404</div>
  <h2 class="mt-2" th:text="${errorTitle ?: 'Không tìm thấy trang'}">Không tìm thấy</h2>
  <p class="text-muted" th:text="${errorMessage ?: 'Trang hoặc dữ liệu bạn tìm kiếm không tồn tại.'}"></p>
  <a th:href="@{/}" class="btn btn-primary mt-2"><i class="bi bi-house me-1"></i>Về trang chủ</a>
</div>
</body>
</html>
