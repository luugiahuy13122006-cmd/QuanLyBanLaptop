<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5" style="max-width:460px">
 <h2 class="mb-4 text-center">Đăng nhập</h2>
 <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
 <div class="alert alert-danger" th:if="${param.error}">Sai tên đăng nhập, mật khẩu hoặc tài khoản đã bị khóa.</div>
 <div class="alert alert-info" th:if="${param.logout}">Bạn đã đăng xuất.</div>
 <form th:action="@{/dang-nhap}" method="post" class="card card-body shadow-sm">
  <div class="mb-3"><label class="form-label">Tên đăng nhập</label>
   <input class="form-control" name="username" required autofocus></div>
  <div class="mb-3"><label class="form-label">Mật khẩu</label>
   <input class="form-control" type="password" name="password" required></div>
  <button class="btn btn-primary w-100">Đăng nhập</button>
 </form>
 <p class="text-center mt-3">Chưa có tài khoản? <a th:href="@{/dang-ky}">Đăng ký</a></p>
</main></body></html>
