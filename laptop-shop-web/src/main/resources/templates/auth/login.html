<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đăng nhập - LaptopShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-header text-white text-center py-3" style="background: var(--pv-blue);">
          <h4 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Đăng nhập hệ thống</h4>
        </div>
        <div class="card-body p-4">
          <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Tên đăng nhập</label>
              <input type="text" name="username" class="form-control" placeholder="admin / staff01 / khach01" required autofocus/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Mật khẩu</label>
              <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required/>
            </div>
            <button type="submit" class="btn btn-pv-primary w-100 fw-semibold py-2">
              <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
            </button>
          </form>

          <hr class="my-4"/>
          <div class="text-center small">
            Chưa có tài khoản? <a th:href="@{/register}" class="fw-semibold">Đăng ký ngay</a>
          </div>
          <div class="alert alert-light border mt-3 mb-0 small">
            <strong>Tài khoản mẫu (Mật khẩu: <code>123456</code>):</strong>
            <ul class="mb-0 ps-3 mt-1">
              <li>Admin: <code>admin</code> (Toàn quyền quản trị)</li>
              <li>Nhân viên: <code>staff01</code> (Quản lý kho, đơn hàng)</li>
              <li>Khách hàng: <code>khach01</code> (Mua hàng, xem đơn)</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
