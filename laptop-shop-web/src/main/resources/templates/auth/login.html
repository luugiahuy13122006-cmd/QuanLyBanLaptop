<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Đăng nhập')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-5">
  <div class="mx-auto nx-filter-bar p-4 p-md-5" style="max-width: 460px;">
    <div class="text-center mb-4">
      <span class="pro-avatar-circle mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.4rem;">
        <i class="bi bi-shield-lock-fill"></i>
      </span>
      <h2 class="h4 fw-bold mb-1">Đăng nhập NEXORA</h2>
      <p class="small text-muted mb-0">Trải nghiệm mua sắm laptop &amp; quản trị đồng bộ</p>
    </div>

    <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>
    <div th:if="${infoMessage}" class="alert alert-info rounded-4 small" th:text="${infoMessage}"></div>

    <form th:action="@{/login}" method="post" class="d-flex flex-column gap-3">
      <input type="hidden" name="redirect" th:value="${param.redirect}"/>
      <div>
        <label class="form-label small fw-semibold">Tên đăng nhập hoặc Email</label>
        <input type="text" name="username" class="form-control" required autofocus placeholder="Nhập tên đăng nhập hoặc email"/>
      </div>
      <div>
        <label class="form-label small fw-semibold">Mật khẩu</label>
        <input type="password" name="password" class="form-control" required placeholder="Nhập mật khẩu"/>
      </div>
      <button type="submit" class="btn btn-pv-primary py-2 fw-bold">
        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
      </button>
    </form>

    <div class="text-center small mt-4 pt-3 border-top">
      Chưa có tài khoản? <a th:href="@{/register}" class="fw-bold">Đăng ký ngay</a>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
