<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đăng nhập - Nexora Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/brand/nexora-mark.svg}"/>
  <link th:href="@{/css/nexora.css}" rel="stylesheet"/>
  <script>document.documentElement.classList.add('nx-js')</script>
  <script th:src="@{/js/nexora.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="pro-auth-bg py-5 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="pro-auth-card">
          <div class="px-4 pt-4 pb-3 text-center border-bottom" style="background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);">
            <div class="d-flex justify-content-center mb-2"><span th:replace="~{fragments/brand :: mark(54)}"></span></div>
            <h4 class="fw-bold text-white mb-1">Đăng nhập hệ thống</h4>
            <p class="small mb-0" style="color: #CBD5E1;">Truy cập Nexora Laptop &amp; Trang Quản trị</p>
          </div>
          <div class="p-4">
            <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

            <form th:action="@{/login}" method="post">
              <input type="hidden" name="redirect" th:if="${param.redirect != null}" th:value="${param.redirect[0]}"/>
              <div class="mb-3">
                <label class="form-label fw-semibold small">Tên đăng nhập</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                  <input type="text" name="username" class="form-control border-start-0" placeholder="Nhập tên đăng nhập" required autofocus/>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold small">Mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                  <input type="password" name="password" class="form-control border-start-0" placeholder="Nhập mật khẩu" required/>
                </div>
              </div>
              <button type="submit" class="btn btn-pv-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
              </button>
            </form>

            <div class="text-center small mt-4 pt-3 border-top text-muted">
              Chưa có tài khoản? <a th:href="@{/register}" class="fw-semibold text-decoration-none">Đăng ký ngay</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
