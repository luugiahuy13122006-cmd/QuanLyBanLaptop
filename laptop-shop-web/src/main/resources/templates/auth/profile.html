<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hồ sơ cá nhân - LaptopShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white fw-bold">
          <i class="bi bi-person-gear me-2 text-warning"></i>Thông tin tài khoản: <span th:text="${account.username}"></span>
        </div>
        <div class="card-body p-4">
          <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>
          <form th:action="@{/tai-khoan}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Vai trò hệ thống</label>
              <input type="text" class="form-control" th:value="${account.role.roleName + ' - ' + account.role.description}" readonly disabled/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
              <input type="text" name="fullName" class="form-control" th:value="${account.fullName}" required/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control" th:value="${account.email}"/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Số điện thoại</label>
              <input type="text" name="phone" class="form-control" th:value="${account.phone}"/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Mật khẩu mới (để trống nếu không đổi)</label>
              <input type="password" name="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự"/>
            </div>
            <button type="submit" class="btn btn-primary w-100">Lưu thay đổi</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
