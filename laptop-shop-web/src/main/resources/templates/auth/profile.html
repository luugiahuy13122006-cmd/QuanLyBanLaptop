<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Hồ sơ cá nhân')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4 py-md-5">
  <div class="row g-4 justify-content-center">
    <div class="col-lg-4 col-xl-3">
      <div class="nx-filter-bar text-center p-4">
        <span class="pro-avatar-circle mx-auto mb-3 fs-4" style="width: 64px; height: 64px; border-radius: 18px;"
              th:text="${#strings.toUpperCase(#strings.substring(account.fullName, 0, 1))}">A</span>
        <h5 class="fw-bold mb-1" th:text="${account.fullName}">Họ tên</h5>
        <div class="text-muted small mb-2">@<span th:text="${account.username}">username</span></div>
        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 mb-3" th:text="${account.role.roleName}">CUSTOMER</span>
        <div class="d-grid gap-2 mt-2">
          <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/tai-khoan/dia-chi}" class="btn btn-outline-primary btn-sm"><i class="bi bi-geo-alt me-1"></i>Sổ địa chỉ giao hàng</a>
          <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/don-hang-cua-toi}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-bag-check me-1"></i>Đơn hàng của tôi</a>
          <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/yeu-thich}" class="btn btn-outline-danger btn-sm"><i class="bi bi-heart me-1"></i>Yêu thích</a>
        </div>
      </div>
    </div>

    <div class="col-lg-8 col-xl-7">
      <div class="nx-filter-bar p-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-person-gear text-primary me-2"></i>Cập nhật hồ sơ cá nhân</h5>
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <form th:action="@{/tai-khoan}" th:object="${profileDTO}" method="post" novalidate class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold small" for="pfFullName">Họ và tên *</label>
            <input type="text" id="pfFullName" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{fullName}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small" for="pfEmail">Email</label>
            <input type="email" id="pfEmail" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small" for="pfPhone">Số điện thoại</label>
            <input type="text" id="pfPhone" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{phone}"></div>
          </div>
          <div class="col-12" sec:authorize="hasRole('CUSTOMER')">
            <label class="form-label fw-semibold small" for="pfAddress">Địa chỉ mặc định</label>
            <textarea id="pfAddress" th:field="*{address}" rows="2" class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{address}"></div>
          </div>

          <hr class="my-2"/>
          <div class="col-12">
            <label class="form-label fw-semibold small" for="pfCurrent">Mật khẩu hiện tại * (xác nhận thay đổi)</label>
            <input type="password" id="pfCurrent" th:field="*{currentPassword}" class="form-control" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small" for="pfNew">Mật khẩu mới (tối thiểu 8 ký tự, chữ + số)</label>
            <input type="password" id="pfNew" th:field="*{newPassword}" class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Xác nhận mật khẩu mới</label>
            <input type="password" th:field="*{confirmNewPassword}" class="form-control"/>
          </div>
          <div class="col-12 mt-3">
            <button type="submit" class="btn btn-pv-primary px-4 py-2 fw-bold"><i class="bi bi-check2-circle me-1"></i>Lưu hồ sơ</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
