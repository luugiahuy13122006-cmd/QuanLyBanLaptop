<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Sổ địa chỉ giao hàng')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main id="mainContent" class="container py-4">
  <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 fw-bold mb-0"><i class="bi bi-geo-alt text-primary me-2"></i>Sổ địa chỉ giao hàng</h2>
    <a th:href="@{/tai-khoan}" class="btn btn-outline-secondary btn-sm">Quay lại hồ sơ</a>
  </div>
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="nx-filter-bar p-4">
        <h6 class="fw-bold mb-3">Địa chỉ đã lưu</h6>
        <div th:if="${addresses.empty}" class="text-muted small">Bạn chưa lưu địa chỉ giao hàng nào.</div>
        <div class="d-flex flex-column gap-3" th:if="${!addresses.empty}">
          <div class="p-3 rounded-4 border d-flex justify-content-between align-items-start gap-2" th:each="a : ${addresses}">
            <div>
              <div class="fw-bold">
                <span th:text="${a.recipientName}"></span> · <span class="tabular-nums" th:text="${a.phone}"></span>
                <span class="badge bg-success ms-1" th:if="${a.isDefault}">Mặc định</span>
              </div>
              <div class="small text-muted mt-1" th:text="${a.fullAddressText}"></div>
            </div>
            <div class="d-flex gap-1">
              <form th:if="${!a.isDefault}" th:action="@{/tai-khoan/dia-chi/{id}/mac-dinh(id=${a.id})}" method="post">
                <button type="submit" class="btn btn-xs btn-outline-primary btn-sm">Đặt mặc định</button>
              </form>
              <form th:action="@{/tai-khoan/dia-chi/{id}/xoa(id=${a.id})}" method="post" data-confirm="Xóa địa chỉ này?">
                <button type="submit" class="btn btn-xs btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="nx-filter-bar p-4">
        <h6 class="fw-bold mb-3">Thêm địa chỉ mới</h6>
        <form th:action="@{/tai-khoan/dia-chi/them}" method="post" class="row g-2">
          <div class="col-6"><input type="text" name="recipientName" class="form-control form-control-sm" placeholder="Người nhận *" required/></div>
          <div class="col-6"><input type="text" name="phone" class="form-control form-control-sm" placeholder="SĐT *" required/></div>
          <div class="col-4"><input type="text" name="province" class="form-control form-control-sm" placeholder="Tỉnh/TP"/></div>
          <div class="col-4"><input type="text" name="district" class="form-control form-control-sm" placeholder="Quận/Huyện"/></div>
          <div class="col-4"><input type="text" name="ward" class="form-control form-control-sm" placeholder="Phường/Xã"/></div>
          <div class="col-12"><input type="text" name="addressLine" class="form-control form-control-sm" placeholder="Số nhà, tên đường *" required/></div>
          <div class="col-12 form-check ms-2">
            <input type="checkbox" name="makeDefault" value="true" class="form-check-input" id="chkDef"/>
            <label for="chkDef" class="form-check-label small">Đặt làm địa chỉ mặc định</label>
          </div>
          <div class="col-12 mt-2"><button type="submit" class="btn btn-pv-primary btn-sm w-100">Lưu địa chỉ</button></div>
        </form>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
