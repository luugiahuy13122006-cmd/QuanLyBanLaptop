<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Quên mật khẩu')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main id="mainContent" class="container py-5">
  <div class="mx-auto nx-filter-bar p-4 p-md-5" style="max-width: 460px;">
    <h2 class="h4 fw-bold mb-2"><i class="bi bi-key text-primary me-2"></i>Quên mật khẩu</h2>
    <p class="small text-muted mb-4">Nhập email đã đăng ký để nhận liên kết đặt lại mật khẩu có hiệu lực trong 30 phút.</p>
    <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>
    <form th:action="@{/forgot-password}" method="post" class="d-flex flex-column gap-3">
      <div>
        <label class="form-label small fw-semibold">Email tài khoản *</label>
        <input type="email" name="email" class="form-control" required placeholder="example@gmail.com"/>
      </div>
      <button type="submit" class="btn btn-pv-primary py-2 fw-bold">Gửi yêu cầu đặt lại</button>
      <a th:href="@{/login}" class="btn btn-outline-secondary">Quay lại đăng nhập</a>
    </form>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
