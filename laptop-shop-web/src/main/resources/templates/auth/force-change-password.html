<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Đổi mật khẩu bắt buộc')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main id="mainContent" class="container py-5">
  <div class="mx-auto nx-filter-bar p-4 p-md-5" style="max-width: 480px;">
    <h2 class="h4 fw-bold mb-2"><i class="bi bi-shield-exclamation text-warning me-2"></i>Cập nhật mật khẩu bảo mật</h2>
    <p class="small text-muted mb-3">Tài khoản <strong th:text="${username}"></strong> đang dùng mật khẩu mặc định trong chế độ vận hành thật. Vui lòng đổi sang mật khẩu mạnh (tối thiểu 8 ký tự, chữ + số).</p>
    <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>
    <form th:action="@{/tai-khoan/doi-mat-khau-bat-buoc}" method="post" class="d-flex flex-column gap-3">
      <div><label class="form-label small fw-semibold">Mật khẩu hiện tại *</label><input type="password" name="currentPassword" class="form-control" required/></div>
      <div><label class="form-label small fw-semibold">Mật khẩu mới *</label><input type="password" name="newPassword" class="form-control" required/></div>
      <div><label class="form-label small fw-semibold">Xác nhận mật khẩu mới *</label><input type="password" name="confirmPassword" class="form-control" required/></div>
      <button type="submit" class="btn btn-pv-primary py-2 fw-bold">Cập nhật &amp; Tiếp tục</button>
    </form>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
