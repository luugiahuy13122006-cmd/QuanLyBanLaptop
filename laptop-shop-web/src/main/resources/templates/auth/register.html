<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Đăng ký tài khoản')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4 py-md-5">
  <div class="mx-auto nx-filter-bar p-4 p-md-5" style="max-width: 620px;">
    <h2 class="h4 fw-bold mb-1"><i class="bi bi-person-plus text-primary me-2"></i>Đăng ký tài khoản khách hàng</h2>
    <p class="small text-muted mb-4">Mật khẩu yêu cầu tối thiểu 8 ký tự gồm cả chữ cái và chữ số.</p>

    <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

    <form th:action="@{/register}" th:object="${registerDTO}" method="post" class="row g-3" novalidate>
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Tên đăng nhập *</label>
        <input type="text" class="form-control" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{username}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Họ và tên *</label>
        <input type="text" class="form-control" th:field="*{fullName}" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{fullName}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Email *</label>
        <input type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{email}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Số điện thoại *</label>
        <input type="text" class="form-control" th:field="*{phone}" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{phone}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Mật khẩu *</label>
        <input type="password" class="form-control" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{password}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Xác nhận mật khẩu *</label>
        <input type="password" class="form-control" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Địa chỉ giao hàng</label>
        <input type="text" class="form-control" th:field="*{address}" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành"/>
      </div>
      <div class="col-12 mt-3">
        <button type="submit" class="btn btn-pv-primary w-100 py-2 fw-bold">Tạo tài khoản</button>
      </div>
    </form>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
