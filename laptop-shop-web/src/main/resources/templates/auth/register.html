<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Đăng ký tài khoản')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4 py-md-5">
  <div class="mx-auto nx-filter-bar p-4 p-md-5" style="max-width: 520px;">
    <div class="text-center mb-4">
      <span class="pro-avatar-circle mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.4rem;">
        <i class="bi bi-person-plus-fill"></i>
      </span>
      <h2 class="h4 fw-bold mb-1">Đăng ký tài khoản</h2>
      <p class="small text-muted mb-0">Tạo tài khoản NEXORA LAPTOP chỉ trong vài giây</p>
    </div>

    <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

    <form th:action="@{/register}" th:object="${registerDTO}" method="post" class="row g-3" novalidate>
      <div class="col-12">
        <label class="form-label small fw-semibold">Email *</label>
        <input type="email" class="form-control" th:field="*{email}"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
               placeholder="name@example.com"/>
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Tên đăng nhập *</label>
        <input type="text" class="form-control" th:field="*{username}"
               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
               placeholder="Chỉ gồm chữ, số hoặc dấu gạch dưới"/>
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Mật khẩu *</label>
        <input type="password" class="form-control" th:field="*{password}"
               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
               placeholder="Nhập mật khẩu"/>
        <div class="form-text small text-muted mt-1">
          <i class="bi bi-info-circle me-1"></i>Mật khẩu yêu cầu tối thiểu 8 ký tự gồm cả chữ cái và chữ số.
        </div>
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Xác nhận mật khẩu *</label>
        <input type="password" class="form-control" th:field="*{confirmPassword}"
               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
               placeholder="Nhập lại mật khẩu"/>
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      </div>
      <div class="col-12 mt-3">
        <button type="submit" class="btn btn-pv-primary w-100 py-2 fw-bold">
          <i class="bi bi-person-check me-1"></i>Tạo tài khoản
        </button>
      </div>
    </form>

    <div class="text-center small mt-4 pt-3 border-top">
      Đã có tài khoản? <a th:href="@{/login}" class="fw-bold">Đăng nhập ngay</a>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
