<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đăng ký tài khoản - LaptopShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="pro-auth-bg py-5 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="pro-auth-card">
          <div class="px-4 pt-4 pb-3 text-center border-bottom" style="background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);">
            <span class="pro-brand-mark mx-auto mb-2" style="width: 46px; height: 46px; font-size: 1.35rem;"><i class="bi bi-person-plus"></i></span>
            <h4 class="fw-bold text-white mb-1">Đăng ký tài khoản</h4>
            <p class="small mb-0" style="color: #CBD5E1;">Tạo tài khoản Khách hàng để theo dõi đơn hàng &amp; thanh toán nhanh</p>
          </div>
          <div class="p-4 p-md-5">
            <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

            <form th:action="@{/register}" th:object="${registerDTO}" method="post" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Tên đăng nhập <span class="text-danger">*</span></label>
                  <input type="text" th:field="*{username}" class="form-control"
                         th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" placeholder="VD: khach03"/>
                  <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Họ và tên <span class="text-danger">*</span></label>
                  <input type="text" th:field="*{fullName}" class="form-control"
                         th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" placeholder="Nguyễn Văn A"/>
                  <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Email <span class="text-danger">*</span></label>
                  <input type="email" th:field="*{email}" class="form-control"
                         th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="email@gmail.com"/>
                  <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Số điện thoại <span class="text-danger">*</span></label>
                  <input type="text" th:field="*{phone}" class="form-control"
                         th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" placeholder="0912345678"/>
                  <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>
                <div class="col-12">
                  <label class="form-label fw-semibold small">Địa chỉ</label>
                  <input type="text" th:field="*{address}" class="form-control" placeholder="Quận 1, TP.HCM"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Mật khẩu <span class="text-danger">*</span></label>
                  <input type="password" th:field="*{password}" class="form-control"
                         th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Tối thiểu 6 ký tự"/>
                  <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                  <input type="password" th:field="*{confirmPassword}" class="form-control"
                         th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" placeholder="Nhập lại mật khẩu"/>
                  <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
              </div>
              <button type="submit" class="btn btn-pv-primary w-100 mt-4 py-2">
                <i class="bi bi-check-circle me-1"></i>Tạo tài khoản ngay
              </button>
            </form>
            <div class="text-center small mt-4 pt-3 border-top text-muted">
              Đã có tài khoản? <a th:href="@{/login}" class="fw-semibold text-decoration-none">Đăng nhập tại đây</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
