<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5" style="max-width:520px">
 <h2 class="mb-4 text-center">Đăng ký tài khoản</h2>
 <form th:action="@{/dang-ky}" th:object="${form}" method="post" class="card card-body shadow-sm">
  <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
   <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
  </div>
  <div class="mb-3"><label class="form-label">Tên đăng nhập</label>
   <input class="form-control" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
   <div class="invalid-feedback" th:errors="*{username}"></div></div>
  <div class="mb-3"><label class="form-label">Họ và tên</label>
   <input class="form-control" th:field="*{fullName}" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
   <div class="invalid-feedback" th:errors="*{fullName}"></div></div>
  <div class="mb-3"><label class="form-label">Email</label>
   <input class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
   <div class="invalid-feedback" th:errors="*{email}"></div></div>
  <div class="mb-3"><label class="form-label">Mật khẩu</label>
   <input class="form-control" type="password" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
   <div class="invalid-feedback" th:errors="*{password}"></div></div>
  <div class="mb-3"><label class="form-label">Nhập lại mật khẩu</label>
   <input class="form-control" type="password" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
   <div class="invalid-feedback" th:errors="*{confirmPassword}"></div></div>
  <button class="btn btn-success w-100">Đăng ký</button>
 </form>
 <p class="text-center mt-3">Đã có tài khoản? <a th:href="@{/dang-nhap}">Đăng nhập</a></p>
</main></body></html>
