<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Đặt lại mật khẩu')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main id="mainContent" class="container py-5">
  <div class="mx-auto nx-filter-bar p-4 p-md-5" style="max-width: 480px;">
    <h2 class="h4 fw-bold mb-2">Đặt lại mật khẩu mới</h2>
    <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>
    <div th:if="${!tokenValid}" class="alert alert-danger small rounded-3">
      Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. <a th:href="@{/forgot-password}">Yêu cầu lại</a>
    </div>
    <form th:if="${tokenValid}" th:action="@{/reset-password}" th:object="${resetDTO}" method="post" class="d-flex flex-column gap-3">
      <input type="hidden" th:field="*{token}"/>
      <div>
        <label class="form-label small fw-semibold">Mật khẩu mới *</label>
        <input type="password" th:field="*{newPassword}" class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{newPassword}"></div>
      </div>
      <div>
        <label class="form-label small fw-semibold">Xác nhận mật khẩu mới *</label>
        <input type="password" th:field="*{confirmPassword}" class="form-control"/>
      </div>
      <button type="submit" class="btn btn-pv-primary py-2 fw-bold">Xác nhận đổi mật khẩu</button>
    </form>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
