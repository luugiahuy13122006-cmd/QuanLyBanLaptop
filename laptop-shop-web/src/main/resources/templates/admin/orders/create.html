<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Đơn hàng Mới - TV4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 750px;">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">🛒 Tạo Đơn Hàng Mới (Có kiểm soát tồn kho Pessimistic Lock)</h5>
        </div>
        <div class="card-body">
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/admin/orders/create}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Chọn Khách hàng (CustomerID) *</label>
                    <select name="customerId" class="form-select" required>
                        <option th:each="c : ${customers}" th:value="${c.customerId}"
                                th:text="${c.customerName + ' - ' + c.phone + ' (' + c.address + ')'}"></option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label fw-semibold">Chọn Laptop *</label>
                        <select name="laptopId" class="form-select" required>
                            <option th:each="l : ${laptops}" th:value="${l.laptopId}"
                                    th:text="${l.sku + ' - ' + l.laptopName + ' | Giá: ' + #numbers.formatDecimal(l.price, 0, 'COMMA', 0, 'POINT') + ' đ (Tồn: ' + l.stockQuantity + ')'}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Số lượng *</label>
                        <input type="number" name="quantity" value="1" min="1" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Người nhận (Bỏ trống để lấy theo KH)</label>
                        <input type="text" name="recipientName" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">SĐT nhận (Bỏ trống để lấy theo KH)</label>
                        <input type="text" name="recipientPhone" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Địa chỉ giao hàng (Bỏ trống để lấy theo KH)</label>
                    <input type="text" name="deliveryAddress" class="form-control">
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Giảm giá (Discount)</label>
                        <input type="number" name="discount" value="0" min="0" step="1000" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Phí giao hàng (ShippingFee)</label>
                        <input type="number" name="shippingFee" value="30000" min="0" step="1000" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Phương thức thanh toán</label>
                        <select name="paymentMethod" class="form-select">
                            <option th:each="pm : ${paymentMethods}" th:value="${pm}" th:text="${pm.displayName}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Ghi chú đơn hàng (Note)</label>
                    <textarea name="note" rows="2" class="form-control"></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/orders}" class="btn btn-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Xác nhận đặt hàng</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
