<!DOCTYPE html>
<!-- Thành viên phụ trách: TV4 - Nguyễn Tuấn Khang -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tạo Đơn hàng Mới - QL Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-4">
      <div class="d-flex align-items-center mb-3">
        <a th:href="@{/admin/orders}" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
        <h2 class="fw-bold mb-0">Tạo Đơn Hàng Mới (Kiểm soát Pessimistic Lock)</h2>
      </div>
      <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

      <div class="card shadow-sm border-0" style="max-width: 780px;">
        <div class="card-body p-4">
          <form th:action="@{/admin/orders/create}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Chọn Khách hàng *</label>
              <select name="customerId" class="form-select" required>
                <option th:each="c : ${customers}" th:value="${c.customerId}"
                        th:text="${c.customerName + ' - ' + c.phone + ' (' + (c.address ?: '') + ')'}"></option>
              </select>
            </div>
            <div class="row g-3">
              <div class="col-md-8 mb-3">
                <label class="form-label fw-semibold">Chọn Laptop *</label>
                <select name="laptopId" class="form-select" required>
                  <option th:each="l : ${laptops}" th:value="${l.laptopId}"
                          th:text="${l.sku + ' - ' + l.name + ' | Giá: ' + #numbers.formatDecimal(l.salePrice, 0, 'COMMA', 0, 'POINT') + ' đ (Tồn: ' + l.stockQuantity + ')'}"></option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Số lượng *</label>
                <input type="number" name="quantity" value="1" min="1" class="form-control" required/>
              </div>
            </div>
            <div class="row g-3">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Người nhận (Bỏ trống lấy theo KH)</label>
                <input type="text" name="recipientName" class="form-control"/>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">SĐT nhận (Bỏ trống lấy theo KH)</label>
                <input type="text" name="recipientPhone" class="form-control"/>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Địa chỉ giao hàng (Bỏ trống lấy theo KH)</label>
              <input type="text" name="deliveryAddress" class="form-control"/>
            </div>
            <div class="row g-3">
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Giảm giá</label>
                <input type="number" name="discount" value="0" min="0" step="1000" class="form-control"/>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Phí giao hàng</label>
                <input type="number" name="shippingFee" value="30000" min="0" step="1000" class="form-control"/>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Phương thức thanh toán</label>
                <select name="paymentMethod" class="form-select">
                  <option th:each="pm : ${paymentMethods}" th:value="${pm}" th:text="${pm.displayName}"></option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Ghi chú đơn hàng</label>
              <textarea name="note" rows="2" class="form-control"></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <a th:href="@{/admin/orders}" class="btn btn-outline-secondary">Hủy</a>
              <button type="submit" class="btn btn-primary px-4">Xác nhận đặt hàng</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
