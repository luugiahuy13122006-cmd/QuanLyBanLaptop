<!DOCTYPE html>
<!-- Thành viên phụ trách: TV4 - Nguyễn Tuấn Khang -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quản lý Đơn hàng - QL Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-4">
      <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="fw-bold mb-0"><i class="bi bi-box-seam me-2"></i>Danh sách Đơn hàng</h2>
        <a th:href="@{/admin/orders/create}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Tạo Đơn hàng</a>
      </div>

      <form th:action="@{/admin/orders}" method="get" class="row g-2 mb-3">
        <div class="col-md-3">
          <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm mã đơn, tên, SĐT..."/>
        </div>
        <div class="col-md-3">
          <select name="status" class="form-select">
            <option value="">-- Tất cả trạng thái --</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == selectedStatus}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <select name="sortBy" class="form-select">
            <option value="orderDate" th:selected="${sortBy == 'orderDate'}">Ngày đặt</option>
            <option value="totalAmount" th:selected="${sortBy == 'totalAmount'}">Tổng tiền</option>
            <option value="orderCode" th:selected="${sortBy == 'orderCode'}">Mã đơn</option>
          </select>
        </div>
        <div class="col-md-2">
          <select name="direction" class="form-select">
            <option value="desc" th:selected="${direction == 'desc'}">Giảm dần</option>
            <option value="asc" th:selected="${direction == 'asc'}">Tăng dần</option>
          </select>
        </div>
        <div class="col-auto d-flex gap-1">
          <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
          <a th:href="@{/admin/orders}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i></a>
        </div>
      </form>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0 align-middle">
            <thead class="table-dark">
              <tr>
                <th>ID</th><th>Mã đơn</th><th>Khách hàng</th><th>Người nhận &amp; SĐT</th>
                <th>Ngày đặt</th><th class="text-end">Tổng tiền</th><th class="text-center">Trạng thái</th><th class="text-center">Chi tiết</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="o : ${orderPage.content}">
                <td th:text="${o.orderId}"></td>
                <td class="fw-bold text-primary" th:text="${o.orderCode}"></td>
                <td th:text="${o.customer != null ? o.customer.customerName : '-'}"></td>
                <td>
                  <div th:text="${o.recipientName}"></div>
                  <small class="text-muted" th:text="${o.recipientPhone}"></small>
                </td>
                <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="text-end text-danger fw-bold" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                <td class="text-center">
                  <span class="badge"
                        th:classappend="${o.orderStatus.name() == 'COMPLETED' ? 'bg-success' : (o.orderStatus.name() == 'CANCELLED' or o.orderStatus.name() == 'RETURNED' ? 'bg-danger' : 'bg-warning text-dark')}"
                        th:text="${o.orderStatus.displayName}"></span>
                </td>
                <td class="text-center">
                  <a th:href="@{/admin/orders/{id}(id=${o.orderId})}" class="btn btn-sm btn-outline-primary">Xem &amp; Xử lý</a>
                </td>
              </tr>
              <tr th:if="${orderPage.empty}">
                <td colspan="8" class="text-center py-4 text-muted">Không có đơn hàng nào.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <nav th:if="${orderPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:each="i : ${#numbers.sequence(0, orderPage.totalPages - 1)}"
              th:classappend="${i == orderPage.number} ? 'active'">
            <a class="page-link" th:href="@{/admin/orders(page=${i}, status=${selectedStatus}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}" th:text="${i + 1}"></a>
          </li>
        </ul>
      </nav>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
