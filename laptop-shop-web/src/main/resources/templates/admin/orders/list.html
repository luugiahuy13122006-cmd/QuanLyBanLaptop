<!DOCTYPE html>
<!-- Thành viên phụ trách: TV4 - Nguyễn Tuấn Khang -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Quản lý Đơn hàng')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-box-seam text-primary me-2"></i>Danh sách Đơn hàng</h4>
          <div class="small text-muted">Quản lý tiến độ đơn hàng, thanh toán &amp; hoàn trả tồn kho</div>
        </div>
        <div class="d-flex gap-2">
          <a th:if="${staffPerms['ORDERS']?.canEdit()}" th:href="@{/admin/orders/create}" class="btn btn-pv-primary btn-sm px-3">
            <i class="bi bi-plus-lg me-1"></i>Tạo Đơn hàng
          </a>
        </div>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <form th:action="@{/admin/orders}" method="get" class="pro-card p-3 mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-3">
              <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Tìm mã đơn, tên, SĐT..."/>
            </div>
            <div class="col-md-3">
              <select name="status" class="form-select form-select-sm">
                <option value="">-- Tất cả trạng thái --</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == selectedStatus}"></option>
              </select>
            </div>
            <div class="col-md-2">
              <select name="sortBy" class="form-select form-select-sm">
                <option value="orderDate" th:selected="${sortBy == 'orderDate'}">Ngày đặt</option>
                <option value="totalAmount" th:selected="${sortBy == 'totalAmount'}">Tổng tiền</option>
                <option value="orderCode" th:selected="${sortBy == 'orderCode'}">Mã đơn</option>
              </select>
            </div>
            <div class="col-md-2">
              <select name="direction" class="form-select form-select-sm">
                <option value="desc" th:selected="${direction == 'desc'}">Giảm dần</option>
                <option value="asc" th:selected="${direction == 'asc'}">Tăng dần</option>
              </select>
            </div>
            <div class="col-auto d-flex gap-1">
              <button type="submit" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-search me-1"></i>Tìm</button>
              <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm" title="Làm mới"><i class="bi bi-x-lg"></i></a>
            </div>
          </div>
        </form>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th><th>Mã đơn</th><th>Khách hàng</th><th>Người nhận &amp; SĐT</th>
                  <th>Ngày đặt</th><th>Thanh toán</th><th class="text-end">Tổng tiền</th><th class="text-center">Trạng thái</th><th class="text-center">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="o : ${orderPage.content}">
                  <td class="text-muted tabular-nums" th:text="${o.orderId}"></td>
                  <td><code class="fw-bold text-primary" th:text="${o.orderCode}"></code></td>
                  <td class="fw-medium" th:text="${o.customer != null ? o.customer.customerName : '-'}"></td>
                  <td>
                    <div class="fw-medium" th:text="${o.recipientName}"></div>
                    <small class="text-muted tabular-nums" th:text="${o.recipientPhone}"></small>
                  </td>
                  <td class="small text-muted tabular-nums" th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                  <td class="small">
                    <div class="fw-medium" th:text="${o.paymentMethod.name() == 'CASH' ? 'Tiền mặt (COD)' : 'Chuyển khoản'}"></div>
                    <span class="badge-soft"
                          th:classappend="${o.paymentStatus.name() == 'PAID' ? 'badge-soft-success' : (o.paymentStatus.name() == 'FAILED' or o.paymentStatus.name() == 'REFUNDED' ? 'badge-soft-danger' : 'badge-soft-slate')}"
                          th:text="${o.paymentStatus.displayName}"></span>
                  </td>
                  <td class="text-end pv-price tabular-nums text-nowrap" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                  <td class="text-center">
                    <span class="badge-soft"
                          th:classappend="${o.orderStatus.name() == 'COMPLETED' ? 'badge-soft-success' : (o.orderStatus.name() == 'CANCELLED' or o.orderStatus.name() == 'RETURNED' or o.orderStatus.name() == 'REFUNDED' ? 'badge-soft-danger' : (o.orderStatus.name() == 'REFUND_REQUESTED' ? 'badge-soft-indigo' : 'badge-soft-warning'))}"
                          th:text="${o.orderStatus.displayName}"></span>
                  </td>
                  <td class="text-center text-nowrap">
                    <a th:href="@{/admin/orders/{id}(id=${o.orderId})}" class="btn btn-sm btn-pv-outline me-1">Xử lý</a>
                    <a th:href="@{/admin/orders/{id}/invoice(id=${o.orderId})}" class="btn btn-sm btn-outline-secondary" title="In hóa đơn"><i class="bi bi-printer"></i></a>
                  </td>
                </tr>
                <tr th:if="${orderPage.empty}">
                  <td colspan="9" class="text-center py-5 text-muted">Không tìm thấy đơn hàng nào.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <nav th:replace="~{fragments/ui :: paginationBar(${orderPage}, '/admin/orders')}"></nav>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
</body>
</html>
