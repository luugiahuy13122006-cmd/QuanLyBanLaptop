<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Duyệt Minh Chứng Chuyển Khoản - QL Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-qr-code-scan text-primary me-2"></i>Chuyển khoản Chờ xác nhận</h4>
          <div class="small text-muted">Đối soát ảnh minh chứng thanh toán VietQR từ khách hàng</div>
        </div>
        <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Về danh sách Đơn hàng</a>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table align-middle mb-0">
              <thead>
                <tr>
                  <th>Mã đơn</th><th>Người nhận</th><th>Số tiền</th><th>Mã giao dịch</th><th>Ảnh minh chứng</th><th>Thời gian tải</th><th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="p : ${pendingPayments}">
                  <td>
                    <a th:href="@{/admin/orders/{id}(id=${p.order.id})}" class="fw-bold font-mono text-primary text-decoration-none" th:text="${p.order.orderCode}"></a>
                  </td>
                  <td>
                    <div class="fw-medium" th:text="${p.order.recipientName}"></div>
                    <small class="text-muted tabular-nums" th:text="${p.order.recipientPhone}"></small>
                  </td>
                  <td class="pv-price tabular-nums text-nowrap" th:text="${#numbers.formatDecimal(p.amount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                  <td><code th:text="${p.transactionCode}"></code></td>
                  <td>
                    <a th:if="${p.proofImage != null}" th:href="@{/admin/payment-proof/{f}(f=${p.proofImage})}" target="_blank">
                      <img th:src="@{/admin/payment-proof/{f}(f=${p.proofImage})}" style="width:76px;height:54px;object-fit:contain;" class="border rounded-3 bg-white p-1 shadow-xs"/>
                    </a>
                  </td>
                  <td class="small text-muted tabular-nums" th:text="${p.proofUploadedAt != null ? #temporals.format(p.proofUploadedAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                  <td style="min-width: 240px;">
                    <div class="d-flex flex-column gap-2">
                      <form th:action="@{/admin/orders/{id}/confirm-payment(id=${p.order.id})}" method="post"
                            onsubmit="return confirm('Xác nhận đã nhận tiền đơn này?');">
                        <button type="submit" class="btn btn-sm btn-success w-100 fw-semibold">
                          <i class="bi bi-check2-circle me-1"></i>Xác nhận đã nhận tiền
                        </button>
                      </form>
                      <form th:action="@{/admin/orders/{id}/reject-proof(id=${p.order.id})}" method="post" class="d-flex gap-1">
                        <input type="text" name="reason" class="form-control form-control-sm" placeholder="Lý do từ chối..." required/>
                        <button type="submit" class="btn btn-sm btn-outline-danger text-nowrap">Từ chối</button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pendingPayments)}">
                  <td colspan="7" class="text-center text-muted py-5">Không có giao dịch chuyển khoản nào đang chờ xác nhận.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
