<!DOCTYPE html>
<!-- Thành viên phụ trách: TV4 - Nguyễn Tuấn Khang -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quản lý Khách hàng - QL Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-people text-primary me-2"></i>Danh sách Khách hàng</h4>
          <div class="small text-muted">Thông tin liên hệ, địa chỉ giao hàng &amp; tài khoản liên kết</div>
        </div>
        <a th:href="@{/admin/customers/create}" class="btn btn-pv-primary btn-sm px-3">
          <i class="bi bi-plus-lg me-1"></i>Thêm Khách hàng
        </a>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <form th:action="@{/admin/customers}" method="get" class="pro-card p-3 mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-4">
              <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Tìm theo tên, SĐT hoặc email..."/>
            </div>
            <div class="col-auto">
              <select name="sortBy" class="form-select form-select-sm">
                <option value="id" th:selected="${sortBy == 'id'}">Mặc định (ID)</option>
                <option value="customerName" th:selected="${sortBy == 'customerName'}">Tên khách hàng</option>
                <option value="phone" th:selected="${sortBy == 'phone'}">Số điện thoại</option>
              </select>
            </div>
            <div class="col-auto">
              <select name="direction" class="form-select form-select-sm">
                <option value="desc" th:selected="${direction == 'desc'}">Giảm dần</option>
                <option value="asc" th:selected="${direction == 'asc'}">Tăng dần</option>
              </select>
            </div>
            <div class="col-auto d-flex gap-1">
              <button type="submit" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-search me-1"></i>Tìm</button>
              <a th:href="@{/admin/customers}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
            </div>
          </div>
        </form>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table mb-0 align-middle">
              <thead>
                <tr>
                  <th>ID</th><th>Họ và tên</th><th>Điện thoại</th><th>Email</th><th>Địa chỉ</th><th>Tài khoản</th><th class="text-center">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="c : ${customerPage.content}">
                  <td class="text-muted tabular-nums" th:text="${c.customerId}"></td>
                  <td class="fw-semibold" th:text="${c.customerName}"></td>
                  <td class="tabular-nums" th:text="${c.phone}"></td>
                  <td class="text-muted" th:text="${c.email != null ? c.email : '-'}"></td>
                  <td th:text="${c.address}"></td>
                  <td>
                    <span th:if="${c.accountId != null}" class="badge-soft badge-soft-info tabular-nums" th:text="'#' + ${c.accountId}"></span>
                    <span th:if="${c.accountId == null}" class="badge-soft badge-soft-slate">Khách lẻ</span>
                  </td>
                  <td class="text-center text-nowrap">
                    <a th:href="@{/admin/customers/edit/{id}(id=${c.customerId})}" class="btn btn-sm btn-outline-primary pro-btn-icon me-1" title="Sửa"><i class="bi bi-pencil"></i></a>
                    <button type="button" class="btn btn-sm btn-outline-danger pro-btn-icon" data-bs-toggle="modal" data-bs-target="#deleteModal"
                            th:attr="data-id=${c.customerId}, data-name=${c.customerName}" title="Xóa"><i class="bi bi-trash"></i></button>
                  </td>
                </tr>
                <tr th:if="${customerPage.empty}">
                  <td colspan="7" class="text-center py-5 text-muted">Không có dữ liệu khách hàng.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <nav th:if="${customerPage.totalPages > 1}" class="mt-4">
          <ul class="pagination pro-pagination justify-content-center">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, customerPage.totalPages - 1)}"
                th:classappend="${i == customerPage.number} ? 'active'">
              <a class="page-link" th:href="@{/admin/customers(page=${i}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}" th:text="${i + 1}"></a>
            </li>
          </ul>
        </nav>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
    <div class="modal-header bg-danger text-white border-0"><h5 class="modal-title fw-bold"><i class="bi bi-trash me-2"></i>Xác nhận xóa</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
    <div class="modal-body p-4">Bạn có chắc muốn xóa khách hàng <strong id="deleteName"></strong>?</div>
    <div class="modal-footer border-0 bg-light">
      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
      <form id="deleteForm" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger px-4">Xóa</button>
      </form>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('deleteModal').addEventListener('show.bs.modal', function(e) {
    var btn = e.relatedTarget;
    document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/customers/delete/' + btn.getAttribute('data-id');
  });
</script>
</body>
</html>
