<!DOCTYPE html>
<!-- Thành viên phụ trách: TV4 - Nguyễn Tuấn Khang -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Quản lý Khách hàng')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-people text-primary me-2"></i>Danh sách Khách hàng</h4>
          <div class="small text-muted">Thông tin liên hệ, địa chỉ giao hàng &amp; tài khoản liên kết</div>
        </div>
        <span class="badge-soft badge-soft-info" title="Khách hàng tự đăng ký tài khoản trên website; quản trị không thêm thủ công">
          <i class="bi bi-person-check"></i>Khách hàng tự đăng ký trên website
        </span>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <form th:action="@{/admin/customers}" method="get" class="pro-card p-3 mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-4">
              <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Tìm theo tên, SĐT hoặc email..."/>
            </div>
            <div class="col-auto">
              <select name="sortBy" class="form-select form-select-sm">
                <option value="id" th:selected="${sortBy == 'id'}">Mặc định (ID)</option>
                <option value="customerName" th:selected="${sortBy == 'customerName'}">Tên khách hàng</option>
                <option value="phone" th:selected="${sortBy == 'phone'}">Số điện thoại</option>
              </select>
            </div>
            <div class="col-auto">
              <select name="direction" class="form-select form-select-sm">
                <option value="desc" th:selected="${direction == 'desc'}">Giảm dần</option>
                <option value="asc" th:selected="${direction == 'asc'}">Tăng dần</option>
              </select>
            </div>
            <div class="col-auto d-flex gap-1">
              <button type="submit" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-search me-1"></i>Tìm</button>
              <a th:href="@{/admin/customers}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
            </div>
          </div>
        </form>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table mb-0 align-middle">
              <thead>
                <tr>
                  <th>ID</th><th>Họ và tên</th><th>Điện thoại</th><th>Email</th><th>Địa chỉ</th><th>Tài khoản</th><th class="text-center">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="c : ${customerPage.content}">
                  <td class="text-muted tabular-nums" th:text="${c.customerId}"></td>
                  <td class="fw-semibold" th:text="${c.customerName}"></td>
                  <td class="tabular-nums" th:text="${c.phone}"></td>
                  <td class="text-muted" th:text="${c.email != null ? c.email : '-'}"></td>
                  <td th:text="${c.address}"></td>
                  <td>
                    <span th:if="${c.accountId != null}" class="badge-soft badge-soft-info tabular-nums" th:text="'#' + ${c.accountId}"></span>
                    <span th:if="${c.accountId == null}" class="badge-soft badge-soft-slate">Khách lẻ</span>
                  </td>
                  <td class="text-center text-nowrap">
                    <a th:if="${staffPerms['CUSTOMERS']?.canEdit()}" th:href="@{/admin/customers/edit/{id}(id=${c.customerId})}" class="btn btn-sm btn-outline-primary pro-btn-icon me-1" title="Sửa"><i class="bi bi-pencil"></i></a>
                    <form th:if="${staffPerms['CUSTOMERS']?.canDelete()}" th:action="@{/admin/customers/delete/{id}(id=${c.customerId})}" method="post" class="d-inline"
                          th:attr="data-confirm='Bạn có chắc muốn xóa khách hàng ' + ${c.customerName} + '?'">
                      <button type="submit" class="btn btn-sm btn-outline-danger pro-btn-icon" title="Xóa"><i class="bi bi-trash"></i></button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${customerPage.empty}">
                  <td colspan="7" class="text-center py-5 text-muted">Không có dữ liệu khách hàng.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <nav th:replace="~{fragments/ui :: paginationBar(${customerPage}, '/admin/customers')}"></nav>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
</body>
</html>
