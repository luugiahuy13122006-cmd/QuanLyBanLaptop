<!DOCTYPE html>
<!-- Thành viên phụ trách: TV4 - Nguyễn Tuấn Khang -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quản lý Khách hàng - QL Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-4">
      <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="fw-bold mb-0"><i class="bi bi-people me-2"></i>Danh sách Khách hàng</h2>
        <a th:href="@{/admin/customers/create}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Thêm Khách hàng</a>
      </div>

      <form th:action="@{/admin/customers}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
          <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên, SĐT hoặc email..."/>
        </div>
        <div class="col-auto">
          <select name="sortBy" class="form-select">
            <option value="id" th:selected="${sortBy == 'id'}">Mặc định (ID)</option>
            <option value="customerName" th:selected="${sortBy == 'customerName'}">Tên khách hàng</option>
            <option value="phone" th:selected="${sortBy == 'phone'}">Số điện thoại</option>
          </select>
        </div>
        <div class="col-auto">
          <select name="direction" class="form-select">
            <option value="desc" th:selected="${direction == 'desc'}">Giảm dần</option>
            <option value="asc" th:selected="${direction == 'asc'}">Tăng dần</option>
          </select>
        </div>
        <div class="col-auto d-flex gap-1">
          <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
          <a th:href="@{/admin/customers}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i></a>
        </div>
      </form>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0 align-middle">
            <thead class="table-dark">
              <tr>
                <th>ID</th><th>Họ và tên</th><th>Điện thoại</th><th>Email</th><th>Địa chỉ</th><th>Tài khoản</th><th class="text-center">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="c : ${customerPage.content}">
                <td th:text="${c.customerId}"></td>
                <td class="fw-semibold" th:text="${c.customerName}"></td>
                <td th:text="${c.phone}"></td>
                <td th:text="${c.email != null ? c.email : '-'}"></td>
                <td th:text="${c.address}"></td>
                <td>
                  <span th:if="${c.accountId != null}" class="badge bg-info text-dark" th:text="'#' + ${c.accountId}"></span>
                  <span th:if="${c.accountId == null}" class="text-muted small">Khách lẻ</span>
                </td>
                <td class="text-center text-nowrap">
                  <a th:href="@{/admin/customers/edit/{id}(id=${c.customerId})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                  <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal"
                          th:attr="data-id=${c.customerId}, data-name=${c.customerName}"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
              <tr th:if="${customerPage.empty}">
                <td colspan="7" class="text-center py-4 text-muted">Không có dữ liệu khách hàng.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <nav th:if="${customerPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:each="i : ${#numbers.sequence(0, customerPage.totalPages - 1)}"
              th:classappend="${i == customerPage.number} ? 'active'">
            <a class="page-link" th:href="@{/admin/customers(page=${i}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}" th:text="${i + 1}"></a>
          </li>
        </ul>
      </nav>
    </main>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-danger text-white"><h5 class="modal-title"><i class="bi bi-trash me-2"></i>Xác nhận xóa</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">Bạn có chắc muốn xóa khách hàng <strong id="deleteName"></strong>?</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
      <form id="deleteForm" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger">Xóa</button>
      </form>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('deleteModal').addEventListener('show.bs.modal', function(e) {
    var btn = e.relatedTarget;
    document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/customers/delete/' + btn.getAttribute('data-id');
  });
</script>
</body>
</html>
