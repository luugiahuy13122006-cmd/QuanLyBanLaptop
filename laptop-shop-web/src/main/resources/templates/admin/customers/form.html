<!DOCTYPE html>
<!-- Thành viên phụ trách: TV4 - Nguyễn Tuấn Khang -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Thông tin Khách hàng - QL Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-4">
      <div class="d-flex align-items-center mb-3">
        <a th:href="@{/admin/customers}" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
        <h2 class="fw-bold mb-0" th:text="${customerDTO.customerId == null ? 'Thêm Khách Hàng Mới' : 'Cập Nhật Khách Hàng #' + customerDTO.customerId}"></h2>
      </div>
      <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

      <div class="card shadow-sm border-0" style="max-width: 650px;">
        <div class="card-body p-4">
          <form th:action="@{/admin/customers/save}" th:object="${customerDTO}" method="post" novalidate>
            <input type="hidden" th:field="*{customerId}"/>

            <div class="mb-3">
              <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
              <input type="text" th:field="*{customerName}" class="form-control" th:classappend="${#fields.hasErrors('customerName')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:errors="*{customerName}"></div>
            </div>

            <div class="row g-3">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
                <input type="text" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{phone}"></div>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{email}"></div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Địa chỉ <span class="text-danger">*</span></label>
              <textarea th:field="*{address}" rows="3" class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
              <div class="invalid-feedback" th:errors="*{address}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Mã tài khoản liên kết (AccountID - Tùy chọn)</label>
              <input type="number" th:field="*{accountId}" class="form-control" placeholder="Để trống nếu là khách mua lẻ"/>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i>Lưu thông tin</button>
              <a th:href="@{/admin/customers}" class="btn btn-outline-secondary">Hủy</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
