<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông tin Khách hàng - TV4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0" th:text="${customerDTO.customerId == null ? 'Thêm Khách Hàng Mới' : 'Cập Nhật Khách Hàng #' + customerDTO.customerId}"></h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/customers/save}" th:object="${customerDTO}" method="post">
                <input type="hidden" th:field="*{customerId}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Họ và tên (CustomerName) *</label>
                    <input type="text" th:field="*{customerName}" class="form-control"
                           th:classappend="${#fields.hasErrors('customerName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{customerName}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Số điện thoại (Phone) *</label>
                        <input type="text" th:field="*{phone}" class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Địa chỉ (Address) *</label>
                    <textarea th:field="*{address}" rows="3" class="form-control"
                              th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{address}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Mã tài khoản liên kết (AccountID - Tùy chọn)</label>
                    <input type="number" th:field="*{accountId}" class="form-control" placeholder="Để trống nếu là khách mua lẻ">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/customers}" class="btn btn-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
