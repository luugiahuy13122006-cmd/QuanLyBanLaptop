<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Hỗ trợ trực tuyến - CSKH')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-chat-dots text-primary me-2"></i>Hỗ trợ trực tuyến Khách hàng</h4>
          <div class="small text-muted">Tiếp nhận tin nhắn tư vấn thời gian thực và phản hồi khách hàng ngay lập tức</div>
        </div>
        <span class="badge-soft badge-soft-success" th:if="${unreadChatCount == 0}">
          <i class="bi bi-check2-all me-1"></i>Đã đọc tất cả
        </span>
        <span class="badge bg-danger rounded-pill px-3 py-2" th:if="${unreadChatCount != null and unreadChatCount > 0}">
          <i class="bi bi-bell-fill me-1"></i><span th:text="${unreadChatCount}"></span> tin nhắn chưa đọc
        </span>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <div class="row g-4">
          <div class="col-lg-4">
            <div class="pro-card h-100">
              <div class="pro-card-header d-flex justify-content-between align-items-center">
                <h6 class="mb-0"><i class="bi bi-people text-primary me-2"></i>Phòng chat khách hàng</h6>
                <span class="badge-soft badge-soft-info" th:text="${#lists.size(chatRooms)} + ' phòng'">0 phòng</span>
              </div>
              <div class="list-group list-group-flush">
                <a th:each="r : ${chatRooms}" th:href="@{/admin/content(room=${r})}"
                   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3"
                   th:classappend="${r == activeRoom ? 'active fw-bold' : ''}">
                  <span><i class="bi bi-chat-left-text me-2"></i><code th:classappend="${r == activeRoom ? 'text-white' : ''}" th:text="${r}"></code></span>
                  <span th:if="${roomUnreadMap != null and roomUnreadMap.get(r) == true}" class="badge bg-danger rounded-pill">Mới</span>
                </a>
                <div th:if="${#lists.isEmpty(chatRooms)}" class="p-4 text-center text-muted small">
                  Chưa có phiên hỗ trợ khách hàng nào.
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="pro-card h-100">
              <div class="pro-card-header d-flex justify-content-between align-items-center">
                <h6 class="mb-0">
                  <i class="bi bi-chat-dots-fill text-primary me-2"></i>
                  <span th:if="${activeRoom != null}">Cuộc hội thoại: <code th:text="${activeRoom}"></code></span>
                  <span th:if="${activeRoom == null}">Chọn một phòng chat để xem nội dung</span>
                </h6>
              </div>
              <div class="p-3">
                <div class="border rounded-3 p-3 mb-3" style="height: 360px; overflow-y: auto; background: var(--surface-2);" id="adminChatBox">
                  <div th:if="${#lists.isEmpty(roomMessages)}" class="text-center text-muted small py-5">
                    Chưa có tin nhắn nào trong phòng này.
                  </div>
                  <div th:each="m : ${roomMessages}" class="mb-3 small"
                       th:classappend="${m.senderRole == 'CUSTOMER' ? '' : 'text-end'}">
                    <div class="mb-1">
                      <span class="badge-soft" th:classappend="${m.senderRole == 'CUSTOMER' ? 'badge-soft-slate' : 'badge-soft-info'}"
                            th:text="${m.senderName + ' (' + m.senderRole + ')'}"></span>
                    </div>
                    <div class="d-inline-block px-3 py-2 rounded-3 text-start"
                         th:classappend="${m.senderRole == 'CUSTOMER' ? 'bg-body border' : 'bg-primary text-white'}"
                         th:text="${m.content}"></div>
                  </div>
                </div>
                <form th:if="${activeRoom != null and staffPerms['SUPPORT_CHAT']?.canEdit()}" id="adminChatReplyForm" class="d-flex gap-2">
                  <input type="hidden" name="roomKey" id="activeRoomKey" th:value="${activeRoom}"/>
                  <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="text" name="content" id="adminChatInput" class="form-control" placeholder="Nhập câu trả lời tới khách hàng..." required autocomplete="off"/>
                  <button type="submit" class="btn btn-pv-primary px-4 text-nowrap">
                    <i class="bi bi-send-fill me-1"></i>Gửi trả lời
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
<script>
  (function () {
    const box = document.getElementById('adminChatBox');
    const activeRoom = document.getElementById('activeRoomKey')?.value;
    if (box) box.scrollTop = box.scrollHeight;

    async function refreshRoom() {
      if (!activeRoom || !box) return;
      try {
        const res = await fetch('/api/chat/messages?roomKey=' + encodeURIComponent(activeRoom));
        if (!res.ok) return;
        const list = await res.json();
        box.innerHTML = list.map(m => {
          const isCust = m.senderRole === 'CUSTOMER';
          return '<div class="mb-3 small ' + (isCust ? '' : 'text-end') + '">' +
            '<div class="mb-1"><span class="badge-soft ' + (isCust ? 'badge-soft-slate' : 'badge-soft-info') + '">' +
            m.senderName + ' (' + m.senderRole + ')</span></div>' +
            '<div class="d-inline-block px-3 py-2 rounded-3 text-start ' + (isCust ? 'bg-body border' : 'bg-primary text-white') + '">' +
            m.content + '</div></div>';
        }).join('');
        box.scrollTop = box.scrollHeight;
      } catch (e) {}
    }

    document.getElementById('adminChatReplyForm')?.addEventListener('submit', async function (e) {
      e.preventDefault();
      const input = document.getElementById('adminChatInput');
      if (!input.value.trim()) return;
      const res = await fetch('/api/chat/send', { method: 'POST', body: new URLSearchParams(new FormData(this)) });
      if (res.ok) {
        input.value = '';
        await refreshRoom();
      }
    });

    if (activeRoom) {
      setInterval(refreshRoom, 3000);
    }
  })();
</script>
</body>
</html>
