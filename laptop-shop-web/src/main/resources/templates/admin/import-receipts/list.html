<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Quản lý Phiếu nhập kho')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-truck-flatbed text-primary me-2"></i>Quản lý Phiếu nhập kho</h4>
          <div class="small text-muted">Theo dõi đợt nhập hàng từ nhà cung cấp &amp; phê duyệt cộng tồn kho</div>
        </div>
        <a th:if="${staffPerms['IMPORT_RECEIPTS']?.canEdit()}" th:href="@{/admin/import-receipts/create}" class="btn btn-pv-primary btn-sm px-3">
          <i class="bi bi-plus-lg me-1"></i>Lập phiếu nhập mới
        </a>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <form th:action="@{/admin/import-receipts}" method="get" class="pro-card p-3 mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-4">
              <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Tìm mã phiếu PN..., nhà cung cấp..."/>
            </div>
            <div class="col-md-3">
              <select name="status" class="form-select form-select-sm">
                <option value="">-- Tất cả trạng thái --</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == selectedStatus}"></option>
              </select>
            </div>
            <div class="col-auto d-flex gap-1">
              <button type="submit" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-search me-1"></i>Tìm</button>
              <a th:href="@{/admin/import-receipts}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
            </div>
          </div>
        </form>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table mb-0 align-middle">
              <thead>
                <tr>
                  <th>ID</th><th>Mã phiếu</th><th>Nhà cung cấp</th><th>Người lập</th>
                  <th>Ngày lập</th><th class="text-end">Tổng tiền</th><th>Công nợ</th><th class="text-center">Trạng thái</th><th class="text-center">Chi tiết</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="r : ${receiptPage.content}">
                  <td class="text-muted tabular-nums" th:text="${r.id}"></td>
                  <td><code class="fw-bold text-primary" th:text="${r.receiptCode}"></code></td>
                  <td class="fw-medium" th:text="${r.supplier}"></td>
                  <td th:text="${r.createdBy != null ? r.createdBy.fullName : '-'}"></td>
                  <td class="small text-muted tabular-nums" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                  <td class="text-end pv-price tabular-nums text-nowrap" th:text="${#numbers.formatDecimal(r.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                  <td>
                    <span class="badge-soft"
                          th:classappend="${r.payableStatus == 'PAID' ? 'badge-soft-success' : (r.payableStatus == 'PARTIAL' ? 'badge-soft-warning' : 'badge-soft-slate')}"
                          th:text="${r.payableStatus ?: 'UNPAID'}"></span>
                  </td>
                  <td class="text-center">
                    <span class="badge-soft"
                          th:classappend="${r.status.name() == 'APPROVED' ? 'badge-soft-success' : (r.status.name() == 'REJECTED' ? 'badge-soft-danger' : 'badge-soft-warning')}"
                          th:text="${r.status.displayName}"></span>
                  </td>
                  <td class="text-center">
                    <a th:href="@{/admin/import-receipts/{id}(id=${r.id})}" class="btn btn-sm btn-pv-outline">Xem &amp; Duyệt</a>
                  </td>
                </tr>
                <tr th:if="${receiptPage.empty}">
                  <td colspan="9" class="text-center text-muted py-5">Chưa có phiếu nhập kho nào.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <nav th:replace="~{fragments/ui :: paginationBar(${receiptPage}, '/admin/import-receipts')}"></nav>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
</body>
</html>
