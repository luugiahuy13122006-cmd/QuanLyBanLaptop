<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Bán hàng tại quầy (POS)')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-upc-scan text-success me-2"></i>Bán hàng tại quầy (POS)</h4>
          <div class="small text-muted">Quét mã SKU nhanh, áp mã giảm giá &amp; xuất hóa đơn in liền trong 1 bước</div>
        </div>
        <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-seam me-1"></i>Danh sách đơn hàng</a>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <div class="row g-4">
          <div class="col-lg-7">
            <div class="pro-card">
              <div class="pro-card-header">
                <h6><i class="bi bi-bag-check text-primary me-2"></i>Tạo giao dịch bán trực tiếp</h6>
              </div>
              <div class="p-4">
                <form th:action="@{/admin/pos/checkout}" method="post" id="posForm" class="row g-3">
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Khách hàng <span class="text-danger">*</span></label>
                    <select name="customerId" class="form-select" required>
                      <option th:each="c : ${customers}" th:value="${c.customerId}"
                              th:text="${c.customerName + ' - ' + c.phone}"></option>
                    </select>
                  </div>

                  <div class="col-md-5">
                    <label class="form-label small fw-semibold">Quét / Nhập nhanh SKU</label>
                    <input type="text" name="skuLookup" id="posSkuInput" class="form-control font-mono-code text-uppercase"
                           placeholder="VD: LT001"/>
                  </div>

                  <div class="col-md-7">
                    <label class="form-label small fw-semibold">Hoặc chọn Laptop</label>
                    <select name="laptopId" id="posLaptopSelect" class="form-select">
                      <option value="">-- Tự động theo SKU hoặc chọn --</option>
                      <option th:each="l : ${laptops}" th:value="${l.id}"
                              th:attr="data-sku=${l.sku},data-price=${l.salePrice},data-stock=${l.stockQuantity}"
                              th:text="${l.sku + ' - ' + l.name + ' (' + #numbers.formatDecimal(l.salePrice, 0, 'COMMA', 0, 'POINT') + ' ₫ | Tồn: ' + l.stockQuantity + ')'}"></option>
                    </select>
                  </div>

                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">Số lượng <span class="text-danger">*</span></label>
                    <input type="number" name="quantity" id="posQty" value="1" min="1" class="form-control tabular-nums" required/>
                  </div>

                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">Mã giảm giá (nếu có)</label>
                    <input type="text" name="couponCode" class="form-control font-mono-code text-uppercase" placeholder="NEXORA10"/>
                  </div>

                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">Giảm trực tiếp (₫)</label>
                    <input type="number" name="discount" id="posDiscount" value="0" min="0" step="10000" class="form-control tabular-nums"/>
                  </div>

                  <div class="col-12">
                    <label class="form-label small fw-semibold">Phương thức thanh toán</label>
                    <div class="d-flex gap-3">
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="paymentMethod" value="CASH" id="posCash" checked/>
                        <label class="form-check-label fw-semibold" for="posCash">Tiền mặt tại quầy</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="paymentMethod" value="BANK_TRANSFER" id="posBank"/>
                        <label class="form-check-label fw-semibold" for="posBank">Chuyển khoản VietQR</label>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 pt-2 d-flex justify-content-between align-items-center border-top">
                    <div>
                      <div class="small text-muted">Tạm tính ước tính</div>
                      <div class="fs-4 fw-bold text-primary tabular-nums" id="posEstimate">0 ₫</div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg px-4 fw-bold">
                      <i class="bi bi-printer me-2"></i>Thanh toán &amp; Xuất hóa đơn
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="pro-card">
              <div class="pro-card-header">
                <h6><i class="bi bi-lightning-charge text-warning me-2"></i>Bảng chọn nhanh Laptop còn hàng</h6>
              </div>
              <div class="list-group list-group-flush" style="max-height: 460px; overflow-y: auto;">
                <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center pos-quick-pick"
                        th:each="l : ${laptops}" th:if="${l.stockQuantity > 0}"
                        th:attr="data-id=${l.id},data-sku=${l.sku}">
                  <div>
                    <code class="fw-bold text-primary" th:text="${l.sku}"></code>
                    <div class="small fw-semibold" th:text="${l.name}"></div>
                    <small class="text-muted" th:text="${'Tồn kho: ' + l.stockQuantity}"></small>
                  </div>
                  <span class="pv-price tabular-nums small" th:text="${#numbers.formatDecimal(l.salePrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
<script>
  (function () {
    const sel = document.getElementById('posLaptopSelect');
    const skuInput = document.getElementById('posSkuInput');
    const qtyInput = document.getElementById('posQty');
    const discInput = document.getElementById('posDiscount');
    const estEl = document.getElementById('posEstimate');
    function recalc() {
      const opt = sel.options[sel.selectedIndex];
      const price = opt ? Number(opt.getAttribute('data-price') || 0) : 0;
      const qty = Math.max(1, Number(qtyInput.value || 1));
      const disc = Math.max(0, Number(discInput.value || 0));
      const total = Math.max(0, price * qty - disc);
      estEl.textContent = new Intl.NumberFormat('vi-VN').format(total) + ' ₫';
    }
    sel?.addEventListener('change', () => {
      const opt = sel.options[sel.selectedIndex];
      if (opt && opt.getAttribute('data-sku')) skuInput.value = opt.getAttribute('data-sku');
      recalc();
    });
    skuInput?.addEventListener('input', () => {
      const val = skuInput.value.trim().toUpperCase();
      for (const opt of sel.options) {
        if ((opt.getAttribute('data-sku') || '').toUpperCase() === val) { sel.value = opt.value; break; }
      }
      recalc();
    });
    document.querySelectorAll('.pos-quick-pick').forEach(btn => {
      btn.addEventListener('click', () => {
        sel.value = btn.getAttribute('data-id');
        skuInput.value = btn.getAttribute('data-sku');
        recalc();
      });
    });
    qtyInput?.addEventListener('input', recalc);
    discInput?.addEventListener('input', recalc);
    recalc();
  })();
</script>
</body>
</html>
