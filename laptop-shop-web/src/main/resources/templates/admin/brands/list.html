<!DOCTYPE html>
<!-- Thành viên phụ trách: TV2 - Phạm Hữu Hiệu -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Thương hiệu Laptop')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-award text-primary me-2"></i>Thương hiệu Laptop</h4>
          <div class="small text-muted">Quản lý hãng sản xuất và xuất xứ thương hiệu</div>
        </div>
        <a th:if="${staffPerms['BRANDS']?.canEdit()}" th:href="@{/admin/brands/add}" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-plus-lg me-1"></i>Thêm thương hiệu</a>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <form th:action="@{/admin/brands}" method="get" class="pro-card p-3 mb-4 d-flex flex-wrap gap-2 align-items-center">
          <input type="text" name="keyword" class="form-control form-control-sm" style="max-width:280px" placeholder="Tìm tên thương hiệu, quốc gia..." th:value="${keyword}"/>
          <select name="sortBy" class="form-select form-select-sm" style="max-width:150px">
            <option value="name" th:selected="${sortBy=='name'}">Tên</option>
            <option value="country" th:selected="${sortBy=='country'}">Quốc gia</option>
            <option value="id" th:selected="${sortBy=='id'}">ID</option>
          </select>
          <select name="direction" class="form-select form-select-sm" style="max-width:130px">
            <option value="asc" th:selected="${direction=='asc'}">Tăng dần</option>
            <option value="desc" th:selected="${direction=='desc'}">Giảm dần</option>
          </select>
          <button type="submit" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-search me-1"></i>Tìm</button>
          <a th:href="@{/admin/brands}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
        </form>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table align-middle mb-0">
              <thead><tr><th>#</th><th>Tên thương hiệu</th><th>Quốc gia</th><th>Mô tả</th><th>Trạng thái</th><th class="text-center">Thao tác</th></tr></thead>
              <tbody>
                <tr th:if="${brandPage.content.isEmpty()}"><td colspan="6" class="text-center text-muted py-5">Không có thương hiệu nào.</td></tr>
                <tr th:each="b, stat : ${brandPage.content}">
                  <td class="text-muted tabular-nums" th:text="${brandPage.number * brandPage.size + stat.index + 1}"></td>
                  <td class="fw-bold" th:text="${b.name}"></td>
                  <td><span class="badge-soft badge-soft-slate" th:text="${b.country}"></span></td>
                  <td class="text-muted" th:text="${b.description}"></td>
                  <td>
                    <span th:if="${b.isActive}" class="badge-soft badge-soft-success">Hoạt động</span>
                    <span th:unless="${b.isActive}" class="badge-soft badge-soft-slate">Ẩn</span>
                  </td>
                  <td class="text-center text-nowrap">
                    <a th:if="${staffPerms['BRANDS']?.canEdit()}" th:href="@{/admin/brands/edit/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary pro-btn-icon me-1" title="Sửa"><i class="bi bi-pencil"></i></a>
                    <form th:if="${staffPerms['BRANDS']?.canDelete()}" th:action="@{/admin/brands/delete/{id}(id=${b.id})}" method="post" class="d-inline"
                          th:attr="data-confirm='Bạn có chắc muốn xóa thương hiệu ' + ${b.name} + '?'">
                      <button type="submit" class="btn btn-sm btn-outline-danger pro-btn-icon" title="Xóa"><i class="bi bi-trash"></i></button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <nav th:replace="~{fragments/ui :: paginationBar(${brandPage}, '/admin/brands')}"></nav>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
</body>
</html>
