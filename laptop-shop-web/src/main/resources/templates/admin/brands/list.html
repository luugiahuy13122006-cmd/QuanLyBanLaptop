<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Thương hiệu</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<style>body{background:#f8f9fa}.sidebar{min-height:100vh;background:#212529}.sidebar .nav-link{color:#adb5bd}.sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:rgba(255,255,255,.1);border-radius:6px}.brand-title{color:#fff;font-weight:700;font-size:1.2rem;padding:1rem;border-bottom:1px solid rgba(255,255,255,.1)}.main-content{padding:2rem}.table th{background-color:#343a40;color:#fff}</style>
</head>
<body>
<div class="container-fluid"><div class="row">
  <nav class="col-md-2 sidebar p-3">
    <div class="brand-title"><i class="bi bi-laptop me-2"></i>QL Laptop</div>
    <ul class="nav flex-column mt-3">
      <li><a class="nav-link" th:href="@{/admin/laptops}"><i class="bi bi-pc-display"></i> Laptop</a></li>
      <li><a class="nav-link" th:href="@{/admin/categories}"><i class="bi bi-tags"></i> Danh mục</a></li>
      <li><a class="nav-link active" th:href="@{/admin/brands}"><i class="bi bi-award"></i> Thương hiệu</a></li>
    </ul>
  </nav>
  <main class="col-md-10 main-content">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2><i class="bi bi-award me-2"></i>Thương hiệu</h2>
      <a th:href="@{/admin/brands/add}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Thêm thương hiệu</a>
    </div>
    <form th:action="@{/admin/brands}" method="get" class="mb-3 d-flex gap-2">
      <input type="text" name="keyword" class="form-control" style="max-width:300px" placeholder="Tìm tên thương hiệu..." th:value="${keyword}"/>
      <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
      <a th:href="@{/admin/brands}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i></a>
    </form>
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead><tr><th>#</th><th>Tên thương hiệu</th><th>Quốc gia</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody>
          <tr th:if="${brandPage.content.isEmpty()}"><td colspan="6" class="text-center text-muted">Không có thương hiệu nào.</td></tr>
          <tr th:each="b, stat : ${brandPage.content}">
            <td th:text="${brandPage.number * brandPage.size + stat.index + 1}"></td>
            <td class="fw-bold" th:text="${b.name}"></td>
            <td th:text="${b.country}"></td>
            <td th:text="${b.description}"></td>
            <td>
              <span th:if="${b.isActive}" class="badge bg-success">Hoạt động</span>
              <span th:unless="${b.isActive}" class="badge bg-secondary">Ẩn</span>
            </td>
            <td>
              <a th:href="@{/admin/brands/edit/{id}(id=${b.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
              <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal"
                      th:attr="data-id=${b.id}, data-name=${b.name}"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <nav th:if="${brandPage.totalPages > 1}">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${brandPage.first} ? 'disabled'"><a class="page-link" th:href="@{/admin/brands(page=${brandPage.number - 1}, keyword=${keyword})}">Trước</a></li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, brandPage.totalPages - 1)}" th:classappend="${i == brandPage.number} ? 'active'"><a class="page-link" th:text="${i + 1}" th:href="@{/admin/brands(page=${i}, keyword=${keyword})}"></a></li>
        <li class="page-item" th:classappend="${brandPage.last} ? 'disabled'"><a class="page-link" th:href="@{/admin/brands(page=${brandPage.number + 1}, keyword=${keyword})}">Sau</a></li>
      </ul>
    </nav>
  </main>
</div></div>
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-danger text-white"><h5 class="modal-title"><i class="bi bi-trash me-2"></i>Xác nhận xóa</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">Bạn có chắc muốn xóa thương hiệu <strong id="deleteName"></strong>?</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
      <form id="deleteForm" method="post"><button type="submit" class="btn btn-danger">Xóa</button></form>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('deleteModal').addEventListener('show.bs.modal', function(e) {
    var btn = e.relatedTarget;
    document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/brands/delete/' + btn.getAttribute('data-id');
  });
</script>
</body></html>
