<!DOCTYPE html>
<!-- Thành viên phụ trách: TV2 - Phạm Hữu Hiệu -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Thương hiệu - Nexora Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/brand/nexora-mark.svg}"/>
  <link th:href="@{/css/nexora.css}" rel="stylesheet"/>
  <script>document.documentElement.classList.add('nx-js')</script>
  <script th:src="@{/js/nexora.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-award text-primary me-2"></i>Thương hiệu Laptop</h4>
          <div class="small text-muted">Quản lý hãng sản xuất và xuất xứ thương hiệu</div>
        </div>
        <a th:href="@{/admin/brands/add}" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-plus-lg me-1"></i>Thêm thương hiệu</a>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <form th:action="@{/admin/brands}" method="get" class="pro-card p-3 mb-4 d-flex flex-wrap gap-2 align-items-center">
          <input type="text" name="keyword" class="form-control form-control-sm" style="max-width:280px" placeholder="Tìm tên thương hiệu, quốc gia..." th:value="${keyword}"/>
          <select name="sortBy" class="form-select form-select-sm" style="max-width:150px">
            <option value="name" th:selected="${sortBy=='name'}">Tên</option>
            <option value="country" th:selected="${sortBy=='country'}">Quốc gia</option>
            <option value="id" th:selected="${sortBy=='id'}">ID</option>
          </select>
          <select name="direction" class="form-select form-select-sm" style="max-width:130px">
            <option value="asc" th:selected="${direction=='asc'}">Tăng dần</option>
            <option value="desc" th:selected="${direction=='desc'}">Giảm dần</option>
          </select>
          <button type="submit" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-search me-1"></i>Tìm</button>
          <a th:href="@{/admin/brands}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
        </form>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table align-middle mb-0">
              <thead><tr><th>#</th><th>Tên thương hiệu</th><th>Quốc gia</th><th>Mô tả</th><th>Trạng thái</th><th class="text-center">Thao tác</th></tr></thead>
              <tbody>
                <tr th:if="${brandPage.content.isEmpty()}"><td colspan="6" class="text-center text-muted py-5">Không có thương hiệu nào.</td></tr>
                <tr th:each="b, stat : ${brandPage.content}">
                  <td class="text-muted tabular-nums" th:text="${brandPage.number * brandPage.size + stat.index + 1}"></td>
                  <td class="fw-bold" th:text="${b.name}"></td>
                  <td><span class="badge-soft badge-soft-slate" th:text="${b.country}"></span></td>
                  <td class="text-muted" th:text="${b.description}"></td>
                  <td>
                    <span th:if="${b.isActive}" class="badge-soft badge-soft-success">Hoạt động</span>
                    <span th:unless="${b.isActive}" class="badge-soft badge-soft-slate">Ẩn</span>
                  </td>
                  <td class="text-center text-nowrap">
                    <a th:href="@{/admin/brands/edit/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary pro-btn-icon me-1" title="Sửa"><i class="bi bi-pencil"></i></a>
                    <button type="button" class="btn btn-sm btn-outline-danger pro-btn-icon" data-bs-toggle="modal" data-bs-target="#deleteModal"
                            th:attr="data-id=${b.id}, data-name=${b.name}" title="Xóa"><i class="bi bi-trash"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <nav th:if="${brandPage.totalPages > 1}" class="mt-4">
          <ul class="pagination pro-pagination justify-content-center">
            <li class="page-item" th:classappend="${brandPage.first} ? 'disabled'">
              <a class="page-link" th:href="@{/admin/brands(page=${brandPage.number - 1}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, brandPage.totalPages - 1)}" th:classappend="${i == brandPage.number} ? 'active'">
              <a class="page-link" th:text="${i + 1}" th:href="@{/admin/brands(page=${i}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}"></a>
            </li>
            <li class="page-item" th:classappend="${brandPage.last} ? 'disabled'">
              <a class="page-link" th:href="@{/admin/brands(page=${brandPage.number + 1}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}">Sau</a>
            </li>
          </ul>
        </nav>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
    <div class="modal-header bg-danger text-white border-0"><h5 class="modal-title fw-bold"><i class="bi bi-trash me-2"></i>Xác nhận xóa</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
    <div class="modal-body p-4">Bạn có chắc muốn xóa thương hiệu <strong id="deleteName"></strong>?</div>
    <div class="modal-footer border-0 bg-light">
      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
      <form id="deleteForm" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger px-4">Xóa</button>
      </form>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('deleteModal').addEventListener('show.bs.modal', function(e) {
    var btn = e.relatedTarget;
    document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/brands/delete/' + btn.getAttribute('data-id');
  });
</script>
</body>
</html>
