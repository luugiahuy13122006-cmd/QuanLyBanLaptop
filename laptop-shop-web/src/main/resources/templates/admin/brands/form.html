<!DOCTYPE html>
<!-- Thành viên phụ trách: TV2 - Phạm Hữu Hiệu -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${isEdit ? 'Cập nhật Thương hiệu' : 'Thêm Thương hiệu'}">Form Thương hiệu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-4">
      <div class="d-flex align-items-center mb-3">
        <a th:href="@{/admin/brands}" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
        <h2 class="fw-bold mb-0" th:text="${isEdit ? 'Cập nhật Thương hiệu' : 'Thêm Thương hiệu Mới'}"></h2>
      </div>
      <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>
      <div class="card shadow-sm border-0" style="max-width: 600px;">
        <div class="card-body p-4">
          <form th:action="${isEdit ? '/admin/brands/edit/' + brandDTO.id : '/admin/brands/add'}"
                th:object="${brandDTO}" method="post" novalidate>
            <div class="mb-3">
              <label class="form-label fw-bold">Tên thương hiệu <span class="text-danger">*</span></label>
              <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Quốc gia</label>
              <input type="text" th:field="*{country}" class="form-control"/>
            </div>
            <div class="mb-3">
              <label class="form-label">Mô tả</label>
              <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="brandActive"/>
              <label class="form-check-label" for="brandActive">Hoạt động</label>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i>Lưu</button>
              <a th:href="@{/admin/brands}" class="btn btn-outline-secondary">Hủy</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
