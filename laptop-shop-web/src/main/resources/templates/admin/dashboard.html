<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản trị</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-4">
 <h2 class="mb-4">Trang quản trị</h2>
 <div class="row g-3 mb-4">
  <div class="col-md-4"><div class="card card-body shadow-sm"><div class="text-muted">Tổng tài khoản</div><div class="fs-2 fw-bold" th:text="${totalUsers}">0</div></div></div>
  <div class="col-md-4"><div class="card card-body shadow-sm"><div class="text-muted">Quản trị viên</div><div class="fs-2 fw-bold" th:text="${totalAdmins}">0</div></div></div>
  <div class="col-md-4"><div class="card card-body shadow-sm"><div class="text-muted">Sản phẩm</div><div class="fs-2 fw-bold" th:text="${totalProducts}">0</div></div></div>
 </div>
 <div class="d-flex gap-2">
  <a class="btn btn-primary" th:href="@{/admin/users}">Quản lý tài khoản</a>
  <a class="btn btn-outline-secondary" th:href="@{/}">Xem cửa hàng</a>
 </div>
</main></body></html>
