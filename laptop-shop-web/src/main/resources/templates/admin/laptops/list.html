<!DOCTYPE html>
<!-- Thành viên phụ trách: TV2 - Phạm Hữu Hiệu -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Danh sách Laptop - QL Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-4">
      <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="fw-bold mb-0"><i class="bi bi-pc-display me-2"></i>Danh sách Laptop</h2>
        <a th:href="@{/admin/laptops/add}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Thêm laptop</a>
      </div>

      <form th:action="@{/admin/laptops}" method="get" class="card shadow-sm border-0 mb-3 p-3">
        <div class="row g-2">
          <div class="col-md-3">
            <input type="text" name="keyword" class="form-control" placeholder="Tìm tên, SKU, hãng..." th:value="${keyword}"/>
          </div>
          <div class="col-md-2">
            <select name="categoryId" class="form-select">
              <option value="">-- Tất cả danh mục --</option>
              <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option>
            </select>
          </div>
          <div class="col-md-2">
            <select name="brandId" class="form-select">
              <option value="">-- Tất cả hãng --</option>
              <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == brandId}"></option>
            </select>
          </div>
          <div class="col-md-2">
            <input type="number" name="minPrice" class="form-control" placeholder="Giá từ" th:value="${minPrice}" step="100000"/>
          </div>
          <div class="col-md-2">
            <input type="number" name="maxPrice" class="form-control" placeholder="Giá đến" th:value="${maxPrice}" step="100000"/>
          </div>
          <div class="col-md-1 d-flex gap-1">
            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
            <a th:href="@{/admin/laptops}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i></a>
          </div>
        </div>
        <div class="row g-2 mt-1 align-items-center">
          <div class="col-auto"><label class="col-form-label small fw-semibold">Sắp xếp:</label></div>
          <div class="col-auto">
            <select name="sortBy" class="form-select form-select-sm">
              <option value="id" th:selected="${sortBy == 'id'}">Mặc định</option>
              <option value="name" th:selected="${sortBy == 'name'}">Tên</option>
              <option value="salePrice" th:selected="${sortBy == 'salePrice'}">Giá bán</option>
              <option value="stockQuantity" th:selected="${sortBy == 'stockQuantity'}">Tồn kho</option>
            </select>
          </div>
          <div class="col-auto">
            <select name="direction" class="form-select form-select-sm">
              <option value="asc" th:selected="${direction == 'asc'}">Tăng dần</option>
              <option value="desc" th:selected="${direction == 'desc'}">Giảm dần</option>
            </select>
          </div>
          <div class="col-auto">
            <select name="size" class="form-select form-select-sm">
              <option value="5" th:selected="${laptopPage.size == 5}">5/trang</option>
              <option value="10" th:selected="${laptopPage.size == 10}">10/trang</option>
              <option value="20" th:selected="${laptopPage.size == 20}">20/trang</option>
            </select>
          </div>
        </div>
      </form>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th><th>Ảnh</th><th>SKU</th><th>Tên laptop</th><th>Danh mục</th><th>Thương hiệu</th>
                <th>CPU</th><th>RAM / SSD</th><th>Giá niêm yết / Giá bán</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${laptopPage.content.isEmpty()}">
                <td colspan="12" class="text-center text-muted py-4">Không có laptop nào.</td>
              </tr>
              <tr th:each="lp, stat : ${laptopPage.content}">
                <td th:text="${laptopPage.number * laptopPage.size + stat.index + 1}"></td>
                <td><img th:src="${lp.displayImageUrl}" th:alt="${lp.name}" style="width:44px;height:44px;object-fit:contain;" class="border rounded bg-white p-1"/></td>
                <td><code th:text="${lp.sku}"></code></td>
                <td class="fw-semibold" th:text="${lp.name}"></td>
                <td th:text="${lp.category.name}"></td>
                <td th:text="${lp.brand.name}"></td>
                <td><small th:text="${lp.cpu}"></small></td>
                <td><small th:text="${lp.ram + ' / ' + lp.storage}"></small></td>
                <td>
                  <div th:if="${lp.discounted}" class="d-flex align-items-center gap-1">
                    <small class="text-muted text-decoration-line-through"
                           th:text="${#numbers.formatDecimal(lp.listPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}"></small>
                    <span class="badge bg-danger" th:text="${'-' + lp.discountPercent + '%'}"></span>
                  </div>
                  <div class="fw-bold text-primary" th:text="${#numbers.formatDecimal(lp.salePrice, 0, 'COMMA', 0, 'POINT') + ' đ'}"></div>
                </td>
                <td>
                  <span th:class="${lp.stockQuantity <= 5 ? 'badge bg-danger' : 'badge bg-success'}" th:text="${lp.stockQuantity}"></span>
                </td>
                <td>
                  <span th:if="${lp.isActive}" class="badge bg-success">Đang bán</span>
                  <span th:unless="${lp.isActive}" class="badge bg-secondary">Ẩn</span>
                </td>
                <td class="text-nowrap">
                  <a th:href="@{/admin/laptops/edit/{id}(id=${lp.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                  <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal"
                          th:attr="data-id=${lp.id}, data-name=${lp.name}"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <nav th:if="${laptopPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${laptopPage.first} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/laptops(page=${laptopPage.number - 1}, size=${laptopPage.size}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, direction=${direction})}">Trước</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, laptopPage.totalPages - 1)}" th:classappend="${i == laptopPage.number} ? 'active'">
            <a class="page-link" th:text="${i + 1}" th:href="@{/admin/laptops(page=${i}, size=${laptopPage.size}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, direction=${direction})}"></a>
          </li>
          <li class="page-item" th:classappend="${laptopPage.last} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/laptops(page=${laptopPage.number + 1}, size=${laptopPage.size}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, direction=${direction})}">Sau</a>
          </li>
        </ul>
      </nav>
    </main>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-danger text-white">
      <h5 class="modal-title"><i class="bi bi-trash me-2"></i>Xác nhận xóa</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">Bạn có chắc muốn xóa laptop <strong id="deleteName"></strong>?</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
      <form id="deleteForm" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger">Xóa</button>
      </form>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('deleteModal').addEventListener('show.bs.modal', function(event) {
    var btn = event.relatedTarget;
    document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/laptops/delete/' + btn.getAttribute('data-id');
  });
</script>
</body>
</html>
