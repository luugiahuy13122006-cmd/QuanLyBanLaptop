<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Danh sách Laptop - Quản Lý Laptop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body{background:#f8f9fa}.sidebar{min-height:100vh;background:#212529}.sidebar .nav-link{color:#adb5bd}
        .sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:rgba(255,255,255,.1);border-radius:6px}
        .brand-title{color:#fff;font-weight:700;font-size:1.2rem;padding:1rem;border-bottom:1px solid rgba(255,255,255,.1)}
        .table th{background-color:#343a40;color:#fff}.main-content{padding:2rem}
    </style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <nav class="col-md-2 sidebar p-3">
    <div class="brand-title"><i class="bi bi-laptop me-2"></i>QL Laptop</div>
    <ul class="nav flex-column mt-3">
      <li class="nav-item"><a class="nav-link active" th:href="@{/admin/laptops}"><i class="bi bi-pc-display"></i> Laptop</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/admin/categories}"><i class="bi bi-tags"></i> Danh mục</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/admin/brands}"><i class="bi bi-award"></i> Thương hiệu</a></li>
      <li class="nav-item mt-3"><a class="nav-link" th:href="@{/admin/stock/test}"><i class="bi bi-cpu"></i> Kiểm thử đa luồng</a></li>
    </ul>
  </nav>
  <main class="col-md-10 main-content">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
      <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
      <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2><i class="bi bi-pc-display me-2"></i>Danh sách Laptop</h2>
      <a th:href="@{/admin/laptops/add}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Thêm laptop</a>
    </div>

    <!-- Bộ lọc tìm kiếm -->
    <form th:action="@{/admin/laptops}" method="get" class="card mb-3 p-3">
      <div class="row g-2">
        <div class="col-md-3">
          <input type="text" name="keyword" class="form-control" placeholder="Tìm tên, hãng..." th:value="${keyword}"/>
        </div>
        <div class="col-md-2">
          <select name="categoryId" class="form-select">
            <option value="">-- Tất cả danh mục --</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                    th:selected="${c.id == categoryId}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <select name="brandId" class="form-select">
            <option value="">-- Tất cả hãng --</option>
            <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"
                    th:selected="${b.id == brandId}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="number" name="minPrice" class="form-control" placeholder="Giá từ" th:value="${minPrice}" step="100000"/>
        </div>
        <div class="col-md-2">
          <input type="number" name="maxPrice" class="form-control" placeholder="Giá đến" th:value="${maxPrice}" step="100000"/>
        </div>
        <div class="col-md-1 d-flex gap-1">
          <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
          <a th:href="@{/admin/laptops}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i></a>
        </div>
      </div>
      <!-- Sắp xếp -->
      <div class="row g-2 mt-1">
        <div class="col-auto">
          <label class="col-form-label">Sắp xếp:</label>
        </div>
        <div class="col-auto">
          <select name="sortBy" class="form-select form-select-sm">
            <option value="id" th:selected="${sortBy=='id'}">Mặc định</option>
            <option value="name" th:selected="${sortBy=='name'}">Tên</option>
            <option value="salePrice" th:selected="${sortBy=='salePrice'}">Giá bán</option>
            <option value="stockQuantity" th:selected="${sortBy=='stockQuantity'}">Tồn kho</option>
          </select>
        </div>
        <div class="col-auto">
          <select name="direction" class="form-select form-select-sm">
            <option value="asc" th:selected="${direction=='asc'}">Tăng dần</option>
            <option value="desc" th:selected="${direction=='desc'}">Giảm dần</option>
          </select>
        </div>
        <div class="col-auto">
          <select name="size" class="form-select form-select-sm">
            <option value="5">5/trang</option>
            <option value="10" selected>10/trang</option>
            <option value="20">20/trang</option>
          </select>
        </div>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>#</th><th>SKU</th><th>Tên laptop</th><th>Danh mục</th><th>Thương hiệu</th>
            <th>CPU</th><th>RAM</th><th>Giá bán</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${laptopPage.content.isEmpty()}">
            <td colspan="11" class="text-center text-muted">Không có laptop nào.</td>
          </tr>
          <tr th:each="lp, stat : ${laptopPage.content}">
            <td th:text="${laptopPage.number * laptopPage.size + stat.index + 1}"></td>
            <td><code th:text="${lp.sku}"></code></td>
            <td th:text="${lp.name}"></td>
            <td th:text="${lp.category.name}"></td>
            <td th:text="${lp.brand.name}"></td>
            <td><small th:text="${lp.cpu}"></small></td>
            <td th:text="${lp.ramGb != null ? lp.ramGb + ' GB' : ''}"></td>
            <td>
              <span class="fw-bold text-primary"
                    th:text="${#numbers.formatDecimal(lp.salePrice, 0, 'COMMA', 0, 'POINT') + ' đ'}"></span>
            </td>
            <td>
              <span th:class="${lp.stockQuantity <= 5 ? 'badge bg-danger' : 'badge bg-success'}"
                    th:text="${lp.stockQuantity}"></span>
            </td>
            <td>
              <span th:if="${lp.isActive}" class="badge bg-success">Đang bán</span>
              <span th:unless="${lp.isActive}" class="badge bg-secondary">Ẩn</span>
            </td>
            <td>
              <a th:href="@{/admin/laptops/edit/{id}(id=${lp.id})}" class="btn btn-sm btn-outline-warning me-1">
                <i class="bi bi-pencil"></i>
              </a>
              <button type="button" class="btn btn-sm btn-outline-danger"
                      data-bs-toggle="modal" data-bs-target="#deleteModal"
                      th:attr="data-id=${lp.id}, data-name=${lp.name}">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Phân trang -->
    <nav th:if="${laptopPage.totalPages > 1}">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${laptopPage.first} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/laptops(page=${laptopPage.number - 1}, size=${laptopPage.size}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId}, sortBy=${sortBy}, direction=${direction})}">Trước</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, laptopPage.totalPages - 1)}"
            th:classappend="${i == laptopPage.number} ? 'active'">
          <a class="page-link" th:text="${i + 1}"
             th:href="@{/admin/laptops(page=${i}, size=${laptopPage.size}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId}, sortBy=${sortBy}, direction=${direction})}"></a>
        </li>
        <li class="page-item" th:classappend="${laptopPage.last} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/laptops(page=${laptopPage.number + 1}, size=${laptopPage.size}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId}, sortBy=${sortBy}, direction=${direction})}">Sau</a>
        </li>
      </ul>
      <p class="text-center text-muted small">
        Trang <span th:text="${laptopPage.number + 1}"></span> / <span th:text="${laptopPage.totalPages}"></span>
        (Tổng <span th:text="${laptopPage.totalElements}"></span> laptop)
      </p>
    </nav>
  </main>
</div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="bi bi-trash me-2"></i>Xác nhận xóa</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Bạn có chắc muốn xóa laptop <strong id="deleteName"></strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <form id="deleteForm" method="post">
          <button type="submit" class="btn btn-danger">Xóa</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  var deleteModal = document.getElementById('deleteModal');
  deleteModal.addEventListener('show.bs.modal', function(event) {
    var btn = event.relatedTarget;
    document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/laptops/delete/' + btn.getAttribute('data-id');
  });
</script>
</body>
</html>
