<!DOCTYPE html>
<!-- Thành viên phụ trách: TV2 - Phạm Hữu Hiệu -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Danh sách Laptop')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-pc-display text-primary me-2"></i>Danh sách Laptop</h4>
          <div class="small text-muted">Quản lý cấu hình, giá bán, khuyến mãi và tồn kho sản phẩm</div>
        </div>
        <a th:href="@{/admin/laptops/add}" class="btn btn-pv-primary btn-sm px-3">
          <i class="bi bi-plus-lg me-1"></i>Thêm laptop
        </a>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <form th:action="@{/admin/laptops}" method="get" class="pro-card mb-4 p-3">
          <div class="row g-2">
            <div class="col-md-3">
              <input type="text" name="keyword" class="form-control form-control-sm" placeholder="Tìm tên, SKU, hãng..." th:value="${keyword}"/>
            </div>
            <div class="col-md-2">
              <select name="categoryId" class="form-select form-select-sm">
                <option value="">-- Tất cả danh mục --</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option>
              </select>
            </div>
            <div class="col-md-2">
              <select name="brandId" class="form-select form-select-sm">
                <option value="">-- Tất cả hãng --</option>
                <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == brandId}"></option>
              </select>
            </div>
            <div class="col-md-2">
              <input type="number" name="minPrice" class="form-control form-control-sm" placeholder="Giá từ" th:value="${minPrice}" step="100000"/>
            </div>
            <div class="col-md-2">
              <input type="number" name="maxPrice" class="form-control form-control-sm" placeholder="Giá đến" th:value="${maxPrice}" step="100000"/>
            </div>
            <div class="col-md-1 d-flex gap-1">
              <button type="submit" class="btn btn-pv-primary btn-sm flex-grow-1"><i class="bi bi-search"></i></button>
              <a th:href="@{/admin/laptops}" class="btn btn-outline-secondary btn-sm" title="Làm mới"><i class="bi bi-x-lg"></i></a>
            </div>
          </div>
          <div class="row g-2 mt-2 align-items-center">
            <div class="col-auto"><label class="col-form-label small fw-semibold text-muted">Sắp xếp:</label></div>
            <div class="col-auto">
              <select name="sortBy" class="form-select form-select-sm">
                <option value="id" th:selected="${sortBy == 'id'}">Mặc định</option>
                <option value="name" th:selected="${sortBy == 'name'}">Tên</option>
                <option value="salePrice" th:selected="${sortBy == 'salePrice'}">Giá bán</option>
                <option value="stockQuantity" th:selected="${sortBy == 'stockQuantity'}">Tồn kho</option>
              </select>
            </div>
            <div class="col-auto">
              <select name="direction" class="form-select form-select-sm">
                <option value="asc" th:selected="${direction == 'asc'}">Tăng dần</option>
                <option value="desc" th:selected="${direction == 'desc'}">Giảm dần</option>
              </select>
            </div>
            <div class="col-auto">
              <select name="size" class="form-select form-select-sm">
                <option value="5" th:selected="${laptopPage.size == 5}">5/trang</option>
                <option value="10" th:selected="${laptopPage.size == 10}">10/trang</option>
                <option value="20" th:selected="${laptopPage.size == 20}">20/trang</option>
              </select>
            </div>
          </div>
        </form>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table pro-table-compact align-middle mb-0">
              <thead>
                <tr>
                  <th>#</th><th>Ảnh</th><th>SKU</th><th>Tên laptop &amp; Danh mục</th><th>Hãng</th>
                  <th>Cấu hình</th><th>Giá bán</th><th>Tồn</th><th>Trạng thái</th><th class="text-center">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${laptopPage.content.isEmpty()}">
                  <td colspan="10" class="text-center text-muted py-5">Không có laptop nào phù hợp.</td>
                </tr>
                <tr th:each="lp, stat : ${laptopPage.content}">
                  <td class="text-muted tabular-nums" th:text="${laptopPage.number * laptopPage.size + stat.index + 1}"></td>
                  <td><img th:src="${lp.displayImageUrl}" th:alt="${lp.name}" style="width:42px;height:42px;object-fit:contain;" class="border rounded-3 bg-white p-1"/></td>
                  <td><code th:text="${lp.sku}"></code></td>
                  <td style="max-width: 195px;">
                    <div class="fw-semibold text-truncate" th:text="${lp.name}" th:title="${lp.name}"></div>
                    <small class="text-muted text-truncate d-block" th:text="${lp.category.name}"></small>
                  </td>
                  <td><span class="badge-soft badge-soft-slate" th:text="${lp.brand.name}"></span></td>
                  <td style="max-width: 170px;">
                    <div class="small fw-medium text-truncate" th:text="${lp.cpu}" th:title="${lp.cpu}"></div>
                    <small class="text-muted text-truncate d-block" th:text="${lp.ram + ' / ' + lp.storage}"></small>
                  </td>
                  <td class="text-nowrap">
                    <div th:if="${lp.discounted}" class="d-flex align-items-center gap-1">
                      <small class="pv-old-price" th:text="${#numbers.formatDecimal(lp.listPrice, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></small>
                      <span class="pv-discount-tag" th:text="${'-' + lp.discountPercent + '%'}"></span>
                    </div>
                    <div class="pv-price" th:text="${#numbers.formatDecimal(lp.salePrice, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></div>
                  </td>
                  <td>
                    <span class="badge-soft tabular-nums"
                          th:classappend="${lp.stockQuantity <= 5 ? 'badge-soft-danger' : 'badge-soft-success'}"
                          th:text="${lp.stockQuantity}"></span>
                  </td>
                  <td>
                    <span th:if="${lp.isActive}" class="badge-soft badge-soft-success">Đang bán</span>
                    <span th:unless="${lp.isActive}" class="badge-soft badge-soft-slate">Ẩn</span>
                  </td>
                  <td class="text-center text-nowrap">
                    <a th:href="@{/admin/laptops/edit/{id}(id=${lp.id})}" class="btn btn-sm btn-outline-primary pro-btn-icon me-1" title="Chỉnh sửa"><i class="bi bi-pencil"></i></a>
                    <form th:action="@{/admin/laptops/delete/{id}(id=${lp.id})}" method="post" class="d-inline"
                          th:attr="data-confirm='Bạn có chắc muốn xóa laptop ' + ${lp.name} + '?'">
                      <button type="submit" class="btn btn-sm btn-outline-danger pro-btn-icon" title="Xóa">
                        <i class="bi bi-trash"></i>
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <nav th:replace="~{fragments/ui :: paginationBar(${laptopPage}, '/admin/laptops')}"></nav>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
</body>
</html>
