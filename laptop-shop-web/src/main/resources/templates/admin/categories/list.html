<!DOCTYPE html>
<!-- Thành viên phụ trách: TV2 - Phạm Hữu Hiệu -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Danh mục - QL Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-4">
      <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="fw-bold mb-0"><i class="bi bi-tags me-2"></i>Danh mục Laptop</h2>
        <a th:href="@{/admin/categories/add}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Thêm danh mục</a>
      </div>

      <form th:action="@{/admin/categories}" method="get" class="mb-3 d-flex flex-wrap gap-2">
        <input type="text" name="keyword" class="form-control" style="max-width:280px" placeholder="Tìm tên danh mục..." th:value="${keyword}"/>
        <select name="sortBy" class="form-select" style="max-width:150px">
          <option value="name" th:selected="${sortBy=='name'}">Tên</option>
          <option value="id" th:selected="${sortBy=='id'}">ID</option>
        </select>
        <select name="direction" class="form-select" style="max-width:130px">
          <option value="asc" th:selected="${direction=='asc'}">Tăng dần</option>
          <option value="desc" th:selected="${direction=='desc'}">Giảm dần</option>
        </select>
        <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i></a>
      </form>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark"><tr><th>#</th><th>Tên danh mục</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody>
              <tr th:if="${categoryPage.content.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">Không có danh mục nào.</td></tr>
              <tr th:each="c, stat : ${categoryPage.content}">
                <td th:text="${categoryPage.number * categoryPage.size + stat.index + 1}"></td>
                <td class="fw-bold" th:text="${c.name}"></td>
                <td th:text="${c.description}"></td>
                <td>
                  <span th:if="${c.isActive}" class="badge bg-success">Hoạt động</span>
                  <span th:unless="${c.isActive}" class="badge bg-secondary">Ẩn</span>
                </td>
                <td class="text-nowrap">
                  <a th:href="@{/admin/categories/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                  <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal"
                          th:attr="data-id=${c.id}, data-name=${c.name}"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <nav th:if="${categoryPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${categoryPage.first} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number - 1}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}">Trước</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, categoryPage.totalPages - 1)}" th:classappend="${i == categoryPage.number} ? 'active'">
            <a class="page-link" th:text="${i + 1}" th:href="@{/admin/categories(page=${i}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}"></a>
          </li>
          <li class="page-item" th:classappend="${categoryPage.last} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number + 1}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}">Sau</a>
          </li>
        </ul>
      </nav>
    </main>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-danger text-white"><h5 class="modal-title"><i class="bi bi-trash me-2"></i>Xác nhận xóa</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">Bạn có chắc muốn xóa danh mục <strong id="deleteName"></strong>?</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
      <form id="deleteForm" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger">Xóa</button>
      </form>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('deleteModal').addEventListener('show.bs.modal', function(e) {
    var btn = e.relatedTarget;
    document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/categories/delete/' + btn.getAttribute('data-id');
  });
</script>
</body>
</html>
