<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Danh mục</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<style>body{background:#f8f9fa}.sidebar{min-height:100vh;background:#212529}.sidebar .nav-link{color:#adb5bd}.sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:rgba(255,255,255,.1);border-radius:6px}.brand-title{color:#fff;font-weight:700;font-size:1.2rem;padding:1rem;border-bottom:1px solid rgba(255,255,255,.1)}.main-content{padding:2rem}.table th{background-color:#343a40;color:#fff}</style>
</head>
<body>
<div class="container-fluid"><div class="row">
  <nav class="col-md-2 sidebar p-3">
    <div class="brand-title"><i class="bi bi-laptop me-2"></i>QL Laptop</div>
    <ul class="nav flex-column mt-3">
      <li><a class="nav-link" th:href="@{/admin/laptops}"><i class="bi bi-pc-display"></i> Laptop</a></li>
      <li><a class="nav-link active" th:href="@{/admin/categories}"><i class="bi bi-tags"></i> Danh mục</a></li>
      <li><a class="nav-link" th:href="@{/admin/brands}"><i class="bi bi-award"></i> Thương hiệu</a></li>
    </ul>
  </nav>
  <main class="col-md-10 main-content">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2><i class="bi bi-tags me-2"></i>Danh mục</h2>
      <a th:href="@{/admin/categories/add}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Thêm danh mục</a>
    </div>
    <form th:action="@{/admin/categories}" method="get" class="mb-3 d-flex gap-2">
      <input type="text" name="keyword" class="form-control" style="max-width:300px" placeholder="Tìm tên danh mục..." th:value="${keyword}"/>
      <select name="sortBy" class="form-select" style="max-width:150px">
        <option value="name" th:selected="${sortBy=='name'}">Tên</option>
        <option value="id" th:selected="${sortBy=='id'}">ID</option>
      </select>
      <select name="direction" class="form-select" style="max-width:130px">
        <option value="asc" th:selected="${direction=='asc'}">Tăng dần</option>
        <option value="desc" th:selected="${direction=='desc'}">Giảm dần</option>
      </select>
      <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
      <a th:href="@{/admin/categories}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i></a>
    </form>
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead><tr><th>#</th><th>Tên danh mục</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody>
          <tr th:if="${categoryPage.content.isEmpty()}"><td colspan="5" class="text-center text-muted">Không có danh mục nào.</td></tr>
          <tr th:each="c, stat : ${categoryPage.content}">
            <td th:text="${categoryPage.number * categoryPage.size + stat.index + 1}"></td>
            <td class="fw-bold" th:text="${c.name}"></td>
            <td th:text="${c.description}"></td>
            <td>
              <span th:if="${c.isActive}" class="badge bg-success">Hoạt động</span>
              <span th:unless="${c.isActive}" class="badge bg-secondary">Ẩn</span>
            </td>
            <td>
              <a th:href="@{/admin/categories/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
              <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal"
                      th:attr="data-id=${c.id}, data-name=${c.name}"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <nav th:if="${categoryPage.totalPages > 1}">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${categoryPage.first} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number - 1}, keyword=${keyword})}">Trước</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, categoryPage.totalPages - 1)}" th:classappend="${i == categoryPage.number} ? 'active'">
          <a class="page-link" th:text="${i + 1}" th:href="@{/admin/categories(page=${i}, keyword=${keyword})}"></a>
        </li>
        <li class="page-item" th:classappend="${categoryPage.last} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number + 1}, keyword=${keyword})}">Sau</a>
        </li>
      </ul>
    </nav>
  </main>
</div></div>
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-danger text-white"><h5 class="modal-title"><i class="bi bi-trash me-2"></i>Xác nhận xóa</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">Bạn có chắc muốn xóa danh mục <strong id="deleteName"></strong>?</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
      <form id="deleteForm" method="post"><button type="submit" class="btn btn-danger">Xóa</button></form>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('deleteModal').addEventListener('show.bs.modal', function(e) {
    var btn = e.relatedTarget;
    document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/categories/delete/' + btn.getAttribute('data-id');
  });
</script>
</body></html>
