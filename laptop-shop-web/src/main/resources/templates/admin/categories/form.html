<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Form Danh Mục</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<style>body{background:#f8f9fa}.sidebar{min-height:100vh;background:#212529}.sidebar .nav-link{color:#adb5bd}.sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:rgba(255,255,255,.1);border-radius:6px}.brand-title{color:#fff;font-weight:700;font-size:1.2rem;padding:1rem;border-bottom:1px solid rgba(255,255,255,.1)}.main-content{padding:2rem}</style>
</head>
<body>
<div class="container-fluid"><div class="row">
  <nav class="col-md-2 sidebar p-3">
    <div class="brand-title"><i class="bi bi-laptop me-2"></i>QL Laptop</div>
    <ul class="nav flex-column mt-3">
      <li><a class="nav-link" th:href="@{/admin/laptops}"><i class="bi bi-pc-display"></i> Laptop</a></li>
      <li><a class="nav-link active" th:href="@{/admin/categories}"><i class="bi bi-tags"></i> Danh mục</a></li>
      <li><a class="nav-link" th:href="@{/admin/brands}"><i class="bi bi-award"></i> Thương hiệu</a></li>
    </ul>
  </nav>
  <main class="col-md-10 main-content">
    <div class="d-flex align-items-center mb-3">
      <a th:href="@{/admin/categories}" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
      <h2 th:text="${isEdit ? 'Cập nhật Danh Mục' : 'Thêm Danh Mục Mới'}"></h2>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span></div>
    <div class="card shadow-sm" style="max-width:600px">
      <div class="card-body">
        <form th:action="${isEdit ? '/admin/categories/edit/' + categoryDTO.id : '/admin/categories/add'}"
              th:object="${categoryDTO}" method="post" novalidate>
          <div class="mb-3">
            <label class="form-label fw-bold">Tên danh mục <span class="text-danger">*</span></label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                   placeholder="VD: Laptop gaming"/>
            <div class="invalid-feedback" th:errors="*{name}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
          </div>
          <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="isActive"/>
            <label class="form-check-label" for="isActive">Hoạt động</label>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i><span th:text="${isEdit ? 'Cập nhật' : 'Thêm mới'}"></span></button>
            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Hủy</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
