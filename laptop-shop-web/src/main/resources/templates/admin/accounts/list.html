<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Quản lý Tài khoản')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-shield-lock text-primary me-2"></i>Quản lý Tài khoản &amp; Phân quyền</h4>
          <div class="small text-muted">Cấp tài khoản nhân viên (STAFF) / quản trị (ADMIN), cấu hình quyền từng chức năng và quản lý trạng thái khóa.</div>
        </div>
        <a th:href="@{/admin/accounts/add}" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-person-plus me-1"></i>Thêm tài khoản</a>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <form th:action="@{/admin/accounts}" method="get" class="pro-card p-3 mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-4">
              <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Tìm username, họ tên, email..."/>
            </div>
            <div class="col-md-3">
              <select name="roleId" class="form-select form-select-sm">
                <option value="">-- Tất cả vai trò --</option>
                <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.roleName}" th:selected="${r.id == roleId}"></option>
              </select>
            </div>
            <div class="col-md-2">
              <select name="sortBy" class="form-select form-select-sm">
                <option value="id" th:selected="${sortBy == 'id'}">ID</option>
                <option value="username" th:selected="${sortBy == 'username'}">Username</option>
                <option value="fullName" th:selected="${sortBy == 'fullName'}">Họ tên</option>
              </select>
            </div>
            <div class="col-md-2">
              <select name="direction" class="form-select form-select-sm">
                <option value="asc" th:selected="${direction == 'asc'}">Tăng dần</option>
                <option value="desc" th:selected="${direction == 'desc'}">Giảm dần</option>
              </select>
            </div>
            <div class="col-md-1 d-flex gap-1">
              <button type="submit" class="btn btn-pv-primary btn-sm flex-grow-1"><i class="bi bi-search"></i></button>
              <a th:href="@{/admin/accounts}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
            </div>
          </div>
        </form>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th><th>Tên đăng nhập</th><th>Họ và tên</th><th>Email</th><th>SĐT</th>
                  <th>Vai trò</th><th>Trạng thái</th><th class="text-center">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${accountPage.empty}">
                  <td colspan="8" class="text-center text-muted py-5">Không có tài khoản nào.</td>
                </tr>
                <tr th:each="a : ${accountPage.content}">
                  <td class="text-muted tabular-nums" th:text="${a.id}"></td>
                  <td><code class="fw-semibold" th:text="${a.username}"></code></td>
                  <td class="fw-semibold" th:text="${a.fullName}"></td>
                  <td class="text-muted" th:text="${a.email ?: '-'}"></td>
                  <td class="tabular-nums" th:text="${a.phone ?: '-'}"></td>
                  <td>
                    <span class="badge-soft"
                          th:classappend="${a.role.roleName == 'ADMIN' ? 'badge-soft-danger' : (a.role.roleName == 'STAFF' ? 'badge-soft-info' : 'badge-soft-indigo')}"
                          th:text="${a.role.roleName}"></span>
                    <div th:if="${a.role.roleName == 'STAFF' and staffPermMap != null and staffPermMap[a.id] != null}" class="d-flex flex-wrap gap-1 mt-1" style="max-width: 240px;">
                      <span th:each="entry : ${staffPermMap[a.id]}" th:if="${entry.value.canView()}"
                            class="badge bg-secondary bg-opacity-10 text-secondary border"
                            style="font-size: 0.65rem;"
                            th:text="${entry.key.displayName + ': ' + entry.value.name()}"></span>
                    </div>
                  </td>
                  <td>
                    <span th:if="${a.isActive}" class="badge-soft badge-soft-success">Hoạt động</span>
                    <span th:unless="${a.isActive}" class="badge-soft badge-soft-slate">Đã khóa</span>
                  </td>
                  <td class="text-center text-nowrap">
                    <a th:if="${a.role.roleName == 'STAFF'}"
                       th:href="@{/admin/accounts/{id}/permissions(id=${a.id})}"
                       class="btn btn-sm btn-outline-info pro-btn-icon me-1" title="Phân quyền chức năng">
                      <i class="bi bi-sliders"></i>
                    </a>
                    <a th:href="@{/admin/accounts/edit/{id}(id=${a.id})}" class="btn btn-sm btn-outline-primary pro-btn-icon me-1" title="Sửa">
                      <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{/admin/accounts/toggle/{id}(id=${a.id})}" method="post" class="d-inline">
                      <button type="submit" class="btn btn-sm btn-outline-secondary pro-btn-icon me-1"
                              th:title="${a.isActive ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
                        <i th:class="${a.isActive ? 'bi bi-lock' : 'bi bi-unlock'}"></i>
                      </button>
                    </form>
                    <form th:action="@{/admin/accounts/delete/{id}(id=${a.id})}" method="post" class="d-inline"
                          th:attr="data-confirm='Bạn có chắc muốn xóa tài khoản ' + ${a.username} + '?'">
                      <button type="submit" class="btn btn-sm btn-outline-danger pro-btn-icon" title="Xóa">
                        <i class="bi bi-trash"></i>
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <nav th:replace="~{fragments/ui :: paginationBar(${accountPage}, '/admin/accounts')}"></nav>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
</body>
</html>
