<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quản lý Tài khoản - QL Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-4">
      <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="fw-bold mb-0"><i class="bi bi-shield-lock me-2"></i>Quản lý Tài khoản &amp; Phân quyền</h2>
        <a th:href="@{/admin/accounts/add}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Thêm tài khoản</a>
      </div>

      <form th:action="@{/admin/accounts}" method="get" class="card shadow-sm border-0 p-3 mb-3">
        <div class="row g-2">
          <div class="col-md-4">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm username, họ tên, email..."/>
          </div>
          <div class="col-md-3">
            <select name="roleId" class="form-select">
              <option value="">-- Tất cả vai trò --</option>
              <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.roleName}" th:selected="${r.id == roleId}"></option>
            </select>
          </div>
          <div class="col-md-2">
            <select name="sortBy" class="form-select">
              <option value="id" th:selected="${sortBy == 'id'}">ID</option>
              <option value="username" th:selected="${sortBy == 'username'}">Username</option>
              <option value="fullName" th:selected="${sortBy == 'fullName'}">Họ tên</option>
            </select>
          </div>
          <div class="col-md-2">
            <select name="direction" class="form-select">
              <option value="asc" th:selected="${direction == 'asc'}">Tăng dần</option>
              <option value="desc" th:selected="${direction == 'desc'}">Giảm dần</option>
            </select>
          </div>
          <div class="col-md-1 d-flex gap-1">
            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
            <a th:href="@{/admin/accounts}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i></a>
          </div>
        </div>
      </form>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID</th><th>Tên đăng nhập</th><th>Họ và tên</th><th>Email</th><th>SĐT</th>
                <th>Vai trò</th><th>Trạng thái</th><th class="text-center">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${accountPage.empty}">
                <td colspan="8" class="text-center text-muted py-4">Không có tài khoản nào.</td>
              </tr>
              <tr th:each="a : ${accountPage.content}">
                <td th:text="${a.id}"></td>
                <td><code th:text="${a.username}"></code></td>
                <td class="fw-semibold" th:text="${a.fullName}"></td>
                <td th:text="${a.email ?: '-'}"></td>
                <td th:text="${a.phone ?: '-'}"></td>
                <td>
                  <span class="badge"
                        th:classappend="${a.role.roleName == 'ADMIN' ? 'bg-danger' : (a.role.roleName == 'STAFF' ? 'bg-primary' : 'bg-info text-dark')}"
                        th:text="${a.role.roleName}"></span>
                </td>
                <td>
                  <span th:if="${a.isActive}" class="badge bg-success">Hoạt động</span>
                  <span th:unless="${a.isActive}" class="badge bg-secondary">Đã khóa</span>
                </td>
                <td class="text-center text-nowrap">
                  <a th:href="@{/admin/accounts/edit/{id}(id=${a.id})}" class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                    <i class="bi bi-pencil"></i>
                  </a>
                  <form th:action="@{/admin/accounts/toggle/{id}(id=${a.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-secondary me-1"
                            th:title="${a.isActive ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
                      <i th:class="${a.isActive ? 'bi bi-lock' : 'bi bi-unlock'}"></i>
                    </button>
                  </form>
                  <button type="button" class="btn btn-sm btn-outline-danger"
                          data-bs-toggle="modal" data-bs-target="#deleteModal"
                          th:attr="data-id=${a.id}, data-name=${a.username}">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <nav th:if="${accountPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:each="i : ${#numbers.sequence(0, accountPage.totalPages - 1)}"
              th:classappend="${i == accountPage.number} ? 'active'">
            <a class="page-link" th:text="${i + 1}"
               th:href="@{/admin/accounts(page=${i}, keyword=${keyword}, roleId=${roleId}, sortBy=${sortBy}, direction=${direction})}"></a>
          </li>
        </ul>
      </nav>
    </main>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-danger text-white">
      <h5 class="modal-title"><i class="bi bi-trash me-2"></i>Xác nhận xóa tài khoản</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">Bạn có chắc muốn xóa tài khoản <strong id="deleteName"></strong>?</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
      <form id="deleteForm" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger">Xóa</button>
      </form>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('deleteModal').addEventListener('show.bs.modal', function(e) {
    var btn = e.relatedTarget;
    document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/accounts/delete/' + btn.getAttribute('data-id');
  });
</script>
</body>
</html>
