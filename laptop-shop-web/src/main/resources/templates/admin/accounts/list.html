<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý tài khoản</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-4">
 <div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="m-0">Quản lý tài khoản</h2><a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">← Quản trị</a>
 </div>
 <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
 <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
 <div class="table-responsive"><table class="table table-bordered align-middle bg-white">
  <thead class="table-light"><tr><th>ID</th><th>Tên đăng nhập</th><th>Họ tên</th><th>Email</th><th>Quyền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
  <tbody>
   <tr th:each="u : ${users}">
    <td th:text="${u.id}"></td>
    <td><span th:text="${u.username}"></span> <span class="badge text-bg-info" th:if="${u.username == currentUser}">bạn</span></td>
    <td th:text="${u.fullName}"></td>
    <td th:text="${u.email}"></td>
    <td>
     <form class="d-flex gap-1 m-0" th:action="@{/admin/users/{id}/quyen(id=${u.id})}" method="post">
      <select name="role" class="form-select form-select-sm" th:disabled="${u.username == currentUser}">
       <option value="USER" th:selected="${u.role == 'USER'}">USER</option>
       <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option>
      </select>
      <button class="btn btn-sm btn-outline-primary" th:disabled="${u.username == currentUser}">Lưu</button>
     </form>
    </td>
    <td><span class="badge" th:classappend="${u.enabled} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${u.enabled} ? 'Hoạt động' : 'Đã khóa'"></span></td>
    <td class="d-flex gap-1">
     <form class="m-0" th:action="@{/admin/users/{id}/khoa(id=${u.id})}" method="post">
      <button class="btn btn-sm btn-outline-warning" th:disabled="${u.username == currentUser}" th:text="${u.enabled} ? 'Khóa' : 'Mở khóa'">Khóa</button>
     </form>
     <form class="m-0" th:action="@{/admin/users/{id}/xoa(id=${u.id})}" method="post" onsubmit="return confirm('Xóa tài khoản này?')">
      <button class="btn btn-sm btn-outline-danger" th:disabled="${u.username == currentUser}">Xóa</button>
     </form>
    </td>
   </tr>
  </tbody>
 </table></div>
</main></body></html>
