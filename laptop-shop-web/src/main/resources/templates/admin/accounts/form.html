<!DOCTYPE html>
<!-- Thành viên phụ trách: TV5 - Vũ Gia Bảo -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${isEdit ? 'Cập nhật Tài khoản' : 'Thêm Tài khoản'}">Form Tài khoản</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/brand/nexora-mark.svg}"/>
  <link th:href="@{/css/nexora.css}" rel="stylesheet"/>
  <script>document.documentElement.classList.add('nx-js')</script>
  <script th:src="@{/js/nexora.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0" th:text="${isEdit ? 'Cập nhật Tài khoản' : 'Thêm Tài khoản Mới'}"></h4>
          <div class="small text-muted">Thiết lập thông tin đăng nhập và vai trò phân quyền hệ thống</div>
        </div>
        <a th:href="@{/admin/accounts}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <div class="pro-card" style="max-width: 720px;">
          <div class="pro-card-header">
            <h6><i class="bi bi-shield-lock text-primary me-2"></i>Thông tin Tài khoản &amp; Vai trò</h6>
          </div>
          <div class="p-4">
            <form th:action="${isEdit ? '/admin/accounts/edit/' + accountDTO.id : '/admin/accounts/add'}"
                  th:object="${accountDTO}" method="post" novalidate>
              <input type="hidden" th:field="*{id}"/>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Tên đăng nhập <span class="text-danger">*</span></label>
                  <input type="text" th:field="*{username}" class="form-control"
                         th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"/>
                  <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">
                    Mật khẩu <span class="text-danger" th:if="${!isEdit}">*</span>
                    <small class="text-muted fw-normal" th:if="${isEdit}">(Để trống nếu không đổi)</small>
                  </label>
                  <input type="password" th:field="*{password}" class="form-control"
                         th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                  <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="col-md-12">
                  <label class="form-label fw-semibold small">Họ và tên <span class="text-danger">*</span></label>
                  <input type="text" th:field="*{fullName}" class="form-control"
                         th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"/>
                  <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Email</label>
                  <input type="email" th:field="*{email}" class="form-control"
                         th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                  <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Số điện thoại</label>
                  <input type="text" th:field="*{phone}" class="form-control"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Vai trò <span class="text-danger">*</span></label>
                  <select th:field="*{roleId}" class="form-select"
                          th:disabled="${lockRole}"
                          th:classappend="${#fields.hasErrors('roleId')} ? 'is-invalid'">
                    <option value="">-- Chọn vai trò --</option>
                    <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.roleName + ' (' + r.description + ')'}"></option>
                  </select>
                  <input type="hidden" name="roleId" th:if="${lockRole}" th:value="${accountDTO.roleId}"/>
                  <div class="invalid-feedback" th:errors="*{roleId}"></div>
                  <div class="form-text" th:if="${lockRole}">Tài khoản khách hàng không thể đổi vai trò.</div>
                  <div class="form-text" th:unless="${lockRole}">Chỉ cấp vai trò nhân viên (STAFF) hoặc quản trị (ADMIN). Khách hàng tự đăng ký trên website.</div>
                </div>
                <div class="col-md-6 d-flex align-items-end">
                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" role="switch" th:field="*{isActive}" id="accActive"/>
                    <label class="form-check-label fw-semibold small" for="accActive">Đang hoạt động</label>
                  </div>
                </div>
              </div>
              <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-pv-primary px-4"><i class="bi bi-save me-1"></i>Lưu tài khoản</button>
                <a th:href="@{/admin/accounts}" class="btn btn-outline-secondary px-4">Hủy</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
