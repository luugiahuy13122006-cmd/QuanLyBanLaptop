<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Quản lý Mã giảm giá')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-ticket-perforated text-primary me-2"></i>Quản lý Mã giảm giá (Voucher)</h4>
          <div class="small text-muted">Thiết lập chương trình khuyến mãi, hạn mức &amp; lượt sử dụng (Pessimistic Lock)</div>
        </div>
      </div>

      <div class="p-3 p-md-4">
        <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

        <div class="row g-4">
          <div class="col-lg-4">
            <div class="pro-card">
              <div class="pro-card-header">
                <h6><i class="bi bi-plus-circle text-primary me-2"></i>Tạo / Cập nhật Mã giảm giá</h6>
              </div>
              <div class="p-3">
                <form th:action="@{/admin/coupons/save}" method="post" class="d-grid gap-2">
                  <div>
                    <label class="form-label small fw-semibold">Mã Code <span class="text-danger">*</span></label>
                    <input type="text" name="code" class="form-control form-control-sm text-uppercase font-mono-code" placeholder="VD: NEXORA10" required/>
                  </div>
                  <div>
                    <label class="form-label small fw-semibold">Mô tả</label>
                    <input type="text" name="description" class="form-control form-control-sm" placeholder="Giảm 10% cho đơn từ 15 triệu"/>
                  </div>
                  <div class="row g-2">
                    <div class="col-6">
                      <label class="form-label small fw-semibold">Loại giảm</label>
                      <select name="discountType" class="form-select form-select-sm">
                        <option th:each="dt : ${discountTypes}" th:value="${dt}" th:text="${dt.name() == 'PERCENT' ? 'Phần trăm (%)' : 'Số tiền (₫)'}"></option>
                      </select>
                    </div>
                    <div class="col-6">
                      <label class="form-label small fw-semibold">Giá trị <span class="text-danger">*</span></label>
                      <input type="number" name="discountValue" class="form-control form-control-sm tabular-nums" min="1" required/>
                    </div>
                  </div>
                  <div class="row g-2">
                    <div class="col-6">
                      <label class="form-label small fw-semibold">Giảm tối đa (₫)</label>
                      <input type="number" name="maxDiscountAmount" class="form-control form-control-sm tabular-nums" placeholder="VD: 2000000"/>
                    </div>
                    <div class="col-6">
                      <label class="form-label small fw-semibold">Đơn tối thiểu (₫)</label>
                      <input type="number" name="minOrderAmount" value="0" class="form-control form-control-sm tabular-nums"/>
                    </div>
                  </div>
                  <div class="row g-2 align-items-end">
                    <div class="col-6">
                      <label class="form-label small fw-semibold">Số lượt tối đa</label>
                      <input type="number" name="maxUsage" value="100" min="1" class="form-control form-control-sm tabular-nums"/>
                    </div>
                    <div class="col-6">
                      <div class="form-check form-switch mb-1">
                        <input class="form-check-input" type="checkbox" name="isActive" value="true" checked id="couponActive"/>
                        <label class="form-check-label small fw-semibold" for="couponActive">Đang bật</label>
                      </div>
                    </div>
                  </div>
                  <button type="submit" class="btn btn-pv-primary btn-sm mt-2"><i class="bi bi-save me-1"></i>Lưu mã giảm giá</button>
                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <form th:action="@{/admin/coupons}" method="get" class="pro-card p-3 mb-3 d-flex gap-2">
              <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Tìm mã coupon hoặc mô tả..."/>
              <button type="submit" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-search"></i></button>
            </form>

            <div class="pro-card">
              <div class="table-responsive">
                <table class="table pro-table align-middle mb-0">
                  <thead>
                    <tr><th>Mã</th><th>Ưu đãi</th><th>Đơn tối thiểu</th><th>Đã dùng</th><th>Trạng thái</th></tr>
                  </thead>
                  <tbody>
                    <tr th:each="c : ${couponPage.content}">
                      <td>
                        <code class="fw-bold text-primary" th:text="${c.code}"></code>
                        <div class="small text-muted" th:text="${c.description}"></div>
                      </td>
                      <td class="tabular-nums fw-semibold">
                        <span th:if="${c.discountType.name() == 'PERCENT'}" th:text="${c.discountValue + '%'}"></span>
                        <span th:unless="${c.discountType.name() == 'PERCENT'}" th:text="${#numbers.formatDecimal(c.discountValue, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></span>
                        <div class="small text-muted fw-normal" th:if="${c.maxDiscountAmount != null}"
                             th:text="'Tối đa ' + ${#numbers.formatDecimal(c.maxDiscountAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></div>
                      </td>
                      <td class="tabular-nums text-nowrap" th:text="${#numbers.formatDecimal(c.minOrderAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                      <td class="tabular-nums text-nowrap" th:text="${c.usedCount + ' / ' + c.maxUsage}"></td>
                      <td>
                        <span th:if="${c.isActive}" class="badge-soft badge-soft-success">Hoạt động</span>
                        <span th:unless="${c.isActive}" class="badge-soft badge-soft-slate">Tạm khóa</span>
                      </td>
                    </tr>
                    <tr th:if="${couponPage.empty}">
                      <td colspan="5" class="text-center text-muted py-4">Chưa có mã giảm giá nào.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <nav th:replace="~{fragments/ui :: paginationBar(${couponPage}, '/admin/coupons')}"></nav>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
</body>
</html>
