<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Lịch sử Biến động Kho')}"></head>
<body>
<div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="~{fragments/admin-layout :: adminSidebar}"></nav>
    <main class="col-lg-10 p-0">
      <div class="pro-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0"><i class="bi bi-arrow-left-right text-primary me-2"></i>Biến động Tồn kho (Inventory Ledger)</h4>
          <div class="small text-muted">Nhật ký mọi giao dịch tăng/giảm tồn kho theo phiếu nhập, đơn bán, hủy &amp; hoàn trả</div>
        </div>
      </div>

      <div class="p-3 p-md-4">
        <form th:action="@{/admin/stock-movements}" method="get" class="pro-card p-3 mb-4 d-flex flex-wrap gap-2 align-items-center">
          <select name="type" class="form-select form-select-sm" style="max-width: 240px;">
            <option value="">-- Tất cả loại biến động --</option>
            <option th:each="t : ${types}" th:value="${t}" th:text="${t.displayName}" th:selected="${t == selectedType}"></option>
          </select>
          <input type="number" name="laptopId" th:value="${laptopId}" class="form-control form-control-sm" style="max-width: 160px;" placeholder="ID Laptop..."/>
          <button type="submit" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-funnel me-1"></i>Lọc</button>
          <a th:href="@{/admin/stock-movements}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
        </form>

        <div class="pro-card">
          <div class="table-responsive">
            <table class="table pro-table pro-table-compact align-middle mb-0">
              <thead>
                <tr><th>#</th><th>Thời gian</th><th>Laptop</th><th>Loại</th><th class="text-center">Thay đổi</th><th class="text-center">Tồn trước &rarr; sau</th><th>Mã tham chiếu</th><th>Lý do</th></tr>
              </thead>
              <tbody>
                <tr th:each="m : ${movementPage.content}">
                  <td class="text-muted tabular-nums" th:text="${m.id}"></td>
                  <td class="small text-muted tabular-nums" th:text="${#temporals.format(m.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
                  <td>
                    <code th:text="${m.laptop.sku}"></code>
                    <div class="small fw-medium" th:text="${m.laptop.name}"></div>
                  </td>
                  <td><span class="badge-soft badge-soft-slate" th:text="${m.movementType.displayName}"></span></td>
                  <td class="text-center fw-bold tabular-nums"
                      th:classappend="${m.quantityDelta >= 0 ? 'text-success' : 'text-danger'}"
                      th:text="${(m.quantityDelta >= 0 ? '+' : '') + m.quantityDelta}"></td>
                  <td class="text-center tabular-nums small">
                    <span th:text="${m.stockBefore}"></span> &rarr; <strong th:text="${m.stockAfter}"></strong>
                  </td>
                  <td><code th:text="${m.referenceCode ?: '-'}"></code></td>
                  <td class="small text-muted" th:text="${m.reason ?: '-'}"></td>
                </tr>
                <tr th:if="${movementPage.empty}">
                  <td colspan="8" class="text-center text-muted py-5">Chưa có biến động tồn kho nào được ghi nhận.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <nav th:replace="~{fragments/ui :: paginationBar(${movementPage}, '/admin/stock-movements')}"></nav>
      </div>
    </main>
  </div>
</div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
</body>
</html>
