<!DOCTYPE html>
<!-- Thành viên phụ trách: TV3 - Trương Xuân Đạt (Trang đặt hàng phong cách Phong Vũ) -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đặt hàng - LaptopShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">
  <h2 class="h4 fw-bold mb-4"><i class="bi bi-bag-check me-2" style="color: var(--pv-blue);"></i>Thông tin Nhận hàng &amp; Thanh toán</h2>

  <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="bg-white rounded-3 border shadow-sm overflow-hidden">
        <div class="px-4 py-3 text-white fw-semibold" style="background: var(--pv-blue);">
          <i class="bi bi-geo-alt me-1"></i>Thông tin người nhận hàng
        </div>
        <div class="p-4">
          <form th:action="@{/dat-hang}" th:object="${checkoutForm}" method="post" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold">Họ và tên người nhận <span class="text-danger">*</span></label>
              <input type="text" th:field="*{recipientName}" class="form-control"
                     th:classappend="${#fields.hasErrors('recipientName')} ? 'is-invalid'" placeholder="Nguyễn Văn An"/>
              <div class="invalid-feedback" th:errors="*{recipientName}"></div>
            </div>

            <div class="row g-3">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
                <input type="text" th:field="*{recipientPhone}" class="form-control"
                       th:classappend="${#fields.hasErrors('recipientPhone')} ? 'is-invalid'" placeholder="0912345678"/>
                <div class="invalid-feedback" th:errors="*{recipientPhone}"></div>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="email@example.com"/>
                <div class="invalid-feedback" th:errors="*{email}"></div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Địa chỉ nhận hàng <span class="text-danger">*</span></label>
              <input type="text" th:field="*{deliveryAddress}" class="form-control"
                     th:classappend="${#fields.hasErrors('deliveryAddress')} ? 'is-invalid'"
                     placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"/>
              <div class="invalid-feedback" th:errors="*{deliveryAddress}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Phương thức thanh toán <span class="text-danger">*</span></label>
              <select th:field="*{paymentMethod}" class="form-select">
                <option th:each="pm : ${paymentMethods}" th:value="${pm}" th:text="${pm.displayName}"></option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Ghi chú đơn hàng</label>
              <textarea th:field="*{note}" rows="2" class="form-control" placeholder="Giao giờ hành chính..."></textarea>
            </div>

            <div class="d-flex justify-content-between pt-2">
              <a th:href="@{/gio-hang}" class="btn btn-outline-secondary">Quay lại giỏ hàng</a>
              <button type="submit" class="btn btn-pv-primary px-4">
                <i class="bi bi-check2-circle me-1"></i>XÁC NHẬN ĐẶT HÀNG
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="bg-white rounded-3 border shadow-sm p-4">
        <h5 class="fw-bold mb-3">Thông tin đơn hàng</h5>
        <ul class="list-group list-group-flush mb-3">
          <li class="list-group-item d-flex justify-content-between align-items-center px-0 gap-2" th:each="item : ${items}">
            <div class="d-flex align-items-center gap-2">
              <img th:src="${item.laptop.displayImageUrl}" style="width:44px;height:44px;object-fit:contain;" class="border rounded p-1"/>
              <div>
                <div class="fw-semibold small" th:text="${item.laptop.name}"></div>
                <small class="text-muted" th:text="'SL: ' + ${item.quantity}"></small>
              </div>
            </div>
            <span class="fw-semibold small text-nowrap" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
          </li>
        </ul>
        <div class="d-flex justify-content-between mb-2 small">
          <span class="text-muted">Tạm tính:</span>
          <span th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
        </div>
        <div class="d-flex justify-content-between mb-2 small">
          <span class="text-muted">Phí vận chuyển:</span>
          <span th:text="${#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
        </div>
        <hr/>
        <div class="d-flex justify-content-between fs-5 fw-bold">
          <span>Thành tiền:</span>
          <span class="pv-price" th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
