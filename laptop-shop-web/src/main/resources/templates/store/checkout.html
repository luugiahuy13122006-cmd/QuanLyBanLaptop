<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Thanh toán & Đặt hàng')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4">
  <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

  <h2 class="fw-bold mb-4"><i class="bi bi-bag-check text-primary me-2"></i>Xác nhận đặt hàng</h2>

  <form th:action="@{/dat-hang}" th:object="${checkoutForm}" method="post" class="row g-4">
    <div class="col-lg-7">
      <div class="nx-filter-bar p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0"><i class="bi bi-geo-alt text-primary me-2"></i>Thông tin giao nhận</h5>
          <a th:href="@{/tai-khoan/dia-chi}" class="small">Quản lý sổ địa chỉ</a>
        </div>

        <div class="mb-3" th:if="${savedAddresses != null and !savedAddresses.isEmpty()}">
          <label class="form-label small fw-semibold">Chọn nhanh từ sổ địa chỉ đã lưu</label>
          <select id="nxAddressPicker" class="form-select form-select-sm" onchange="applySavedAddress(this)">
            <option value="">-- Nhập thủ công hoặc chọn địa chỉ --</option>
            <option th:each="addr : ${savedAddresses}"
                    th:data-name="${addr.recipientName}"
                    th:data-phone="${addr.phone}"
                    th:data-addr="${addr.fullAddressText}"
                    th:text="${addr.recipientName + ' - ' + addr.phone + ' (' + addr.fullAddressText + ')'}"></option>
          </select>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Họ tên người nhận *</label>
            <input type="text" class="form-control" th:field="*{recipientName}" th:classappend="${#fields.hasErrors('recipientName')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{recipientName}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Số điện thoại *</label>
            <input type="text" class="form-control" th:field="*{recipientPhone}" th:classappend="${#fields.hasErrors('recipientPhone')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{recipientPhone}"></div>
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold">Email nhận hóa đơn &amp; thông báo</label>
            <input type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold">Hình thức nhận hàng</label>
            <div class="d-flex flex-wrap gap-3">
              <label class="form-check border rounded-3 px-3 py-2 flex-grow-1">
                <input class="form-check-input" type="radio" th:field="*{deliveryMethod}" value="DELIVERY" onchange="recalcSummary()"/>
                <span class="form-check-label fw-semibold">Giao hàng tận nơi (Freeship đơn ≥ 15 triệu)</span>
              </label>
              <label class="form-check border rounded-3 px-3 py-2 flex-grow-1">
                <input class="form-check-input" type="radio" th:field="*{deliveryMethod}" value="PICKUP" onchange="recalcSummary()"/>
                <span class="form-check-label fw-semibold">Nhận tại showroom NEXORA (Miễn phí)</span>
              </label>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold">Địa chỉ giao hàng *</label>
            <input type="text" class="form-control" th:field="*{deliveryAddress}" th:classappend="${#fields.hasErrors('deliveryAddress')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{deliveryAddress}"></div>
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold">Ghi chú đơn hàng</label>
            <textarea class="form-control" rows="2" th:field="*{note}" placeholder="Thời gian giao mong muốn, xuất hóa đơn công ty..."></textarea>
          </div>
        </div>
      </div>

      <div class="nx-filter-bar p-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-wallet2 text-primary me-2"></i>Phương thức thanh toán</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="border rounded-4 p-3 d-block h-100 cursor-pointer">
              <input class="form-check-input me-2" type="radio" th:field="*{paymentMethod}" value="BANK_TRANSFER"/>
              <strong><i class="bi bi-qr-code text-primary me-1"></i>Chuyển khoản VietQR</strong>
              <p class="small text-muted mb-0 mt-1">Quét mã QR, giữ tồn kho trong <span th:text="${shopProperties.payment.expireMinutes}">30</span> phút.</p>
            </label>
          </div>
          <div class="col-md-6">
            <label class="border rounded-4 p-3 d-block h-100 cursor-pointer">
              <input class="form-check-input me-2" type="radio" th:field="*{paymentMethod}" value="CASH"/>
              <strong><i class="bi bi-cash-coin text-success me-1"></i>Tiền mặt khi nhận hàng (COD)</strong>
              <p class="small text-muted mb-0 mt-1">Kiểm tra máy nguyên seal trước khi thanh toán cho shipper.</p>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Order Summary Sticky -->
    <div class="col-lg-5">
      <div class="nx-filter-bar p-4 sticky-lg-top" style="top: 96px;">
        <h5 class="fw-bold mb-3">Chi tiết thanh toán</h5>
        <div class="d-flex flex-column gap-2 mb-3 pb-3 border-bottom small">
          <div class="d-flex justify-content-between" th:each="it : ${items}">
            <span class="text-truncate me-2" th:text="${it.quantity + 'x ' + it.laptop.name}"></span>
            <strong class="tabular-nums text-nowrap" th:text="${#numbers.formatDecimal(it.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></strong>
          </div>
        </div>

        <div class="input-group input-group-sm mb-2">
          <input type="text" id="nxCouponInput" class="form-control text-uppercase" th:field="*{couponCode}" placeholder="Nhập mã giảm giá (VD: NEXORA10)"/>
          <button type="button" class="btn btn-outline-primary" onclick="checkCoupon()">Áp dụng</button>
        </div>
        <div id="nxCouponMsg" class="small mb-3"></div>

        <div class="d-flex justify-content-between small mb-2">
          <span class="text-muted">Tạm tính</span>
          <strong id="nxSubVal" th:data-val="${subtotal}" th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></strong>
        </div>
        <div class="d-flex justify-content-between small mb-2">
          <span class="text-muted">Giảm giá voucher</span>
          <strong class="text-success" id="nxDiscVal">0 ₫</strong>
        </div>
        <div class="d-flex justify-content-between small mb-3">
          <span class="text-muted">Phí vận chuyển</span>
          <strong id="nxShipVal" th:text="${shippingFee.signum() == 0 ? 'Miễn phí' : #numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></strong>
        </div>

        <div class="d-flex justify-content-between align-items-center pt-3 border-top mb-4">
          <span class="fw-bold fs-6">Tổng thanh toán (đã gồm VAT)</span>
          <span class="nx-price-now fs-4 tabular-nums" id="nxTotalVal" th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
        </div>

        <button type="submit" class="btn btn-pv-primary w-100 py-3 fw-bold">
          <i class="bi bi-check-circle me-1"></i>Đặt hàng ngay
        </button>
      </div>
    </div>
  </form>
</main>

<script>
  var currentDiscount = 0;
  function applySavedAddress(sel) {
    var opt = sel.options[sel.selectedIndex];
    if (!opt || !opt.dataset.name) return;
    document.querySelector('[name="recipientName"]').value = opt.dataset.name;
    document.querySelector('[name="recipientPhone"]').value = opt.dataset.phone;
    document.querySelector('[name="deliveryAddress"]').value = opt.dataset.addr;
  }
  function checkCoupon() {
    var code = document.getElementById('nxCouponInput').value.trim();
    var sub = document.getElementById('nxSubVal').dataset.val;
    var msgEl = document.getElementById('nxCouponMsg');
    if (!code) { currentDiscount = 0; msgEl.textContent = ''; recalcSummary(); return; }
    fetch('/api/coupons/check?code=' + encodeURIComponent(code) + '&subtotal=' + encodeURIComponent(sub))
      .then(r => r.json())
      .then(data => {
        if (data.valid) {
          currentDiscount = Number(data.discount || 0);
          msgEl.className = 'small text-success mb-3';
          msgEl.textContent = data.message + ' (-' + currentDiscount.toLocaleString('vi-VN') + ' ₫)';
        } else {
          currentDiscount = 0;
          msgEl.className = 'small text-danger mb-3';
          msgEl.textContent = data.message || 'Mã không hợp lệ';
        }
        recalcSummary();
      }).catch(() => {});
  }
  function recalcSummary() {
    var sub = Number(document.getElementById('nxSubVal').dataset.val || 0);
    var pickup = document.querySelector('input[name="deliveryMethod"][value="PICKUP"]').checked;
    var ship = (pickup || sub >= 15000000) ? 0 : 50000;
    document.getElementById('nxDiscVal').textContent = '-' + currentDiscount.toLocaleString('vi-VN') + ' ₫';
    document.getElementById('nxShipVal').textContent = ship === 0 ? 'Miễn phí' : ship.toLocaleString('vi-VN') + ' ₫';
    document.getElementById('nxTotalVal').textContent = Math.max(0, sub - currentDiscount + ship).toLocaleString('vi-VN') + ' ₫';
  }
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
