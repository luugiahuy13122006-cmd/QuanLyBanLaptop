<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Tin công nghệ & Hỏi đáp FAQ')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4 py-md-5">
  <h2 class="fw-bold mb-4"><i class="bi bi-newspaper text-primary me-2"></i>Tin tức &amp; Tư vấn chọn Laptop</h2>

  <div class="row g-4 mb-5">
    <div class="col-md-6" th:each="a : ${articlePage.content}">
      <article class="nx-card p-3">
        <div class="nx-thumb-box rounded-3 mb-3">
          <img th:src="${a.coverImage != null ? a.coverImage : '/images/laptop-default.svg'}" th:alt="${a.title}"/>
        </div>
        <div class="small text-muted mb-1" th:text="${a.author + ' · ' + #temporals.format(a.createdAt, 'dd/MM/yyyy')}"></div>
        <h5 class="fw-bold mb-2"><a th:href="@{/tin-tuc/{s}(s=${a.slug})}" class="text-reset" th:text="${a.title}"></a></h5>
        <p class="small text-muted mb-3" th:text="${a.summary}"></p>
        <a th:href="@{/tin-tuc/{s}(s=${a.slug})}" class="small fw-semibold mt-auto">Đọc tiếp <i class="bi bi-arrow-right"></i></a>
      </article>
    </div>
  </div>

  <section class="nx-filter-bar p-4" th:if="${faqs != null and !faqs.empty}">
    <h4 class="fw-bold mb-3"><i class="bi bi-question-circle text-primary me-2"></i>Câu hỏi thường gặp (FAQ)</h4>
    <div class="accordion accordion-flush" id="nxFaqAcc">
      <div class="accordion-item bg-transparent" th:each="f, st : ${faqs}">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed bg-transparent text-reset fw-semibold" type="button"
                  data-bs-toggle="collapse" th:data-bs-target="'#faq-' + ${f.id}"
                  th:text="${'[' + f.topic + '] ' + f.question}"></button>
        </h2>
        <div th:id="'faq-' + ${f.id}" class="accordion-collapse collapse" data-bs-parent="#nxFaqAcc">
          <div class="accordion-body small text-muted" th:text="${f.answer}"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
