<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${page.title + ' - Nexora Laptop'}">Thông tin - Nexora Laptop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/brand/nexora-mark.svg}"/>
  <link th:href="@{/css/nexora.css}" rel="stylesheet"/>
  <script>document.documentElement.classList.add('nx-js')</script>
  <script th:src="@{/js/nexora.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4 py-md-5">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb small mb-0">
      <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
      <li class="breadcrumb-item active" aria-current="page" th:text="${page.title}">Thông tin</li>
    </ol>
  </nav>

  <div class="nx-page-hero mb-4">
    <div class="d-flex align-items-start gap-3 position-relative" style="z-index: 2;">
      <span class="d-inline-flex align-items-center justify-content-center rounded-4 flex-shrink-0 nx-float"
            style="width: 58px; height: 58px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25); font-size: 1.6rem;">
        <i class="bi" th:classappend="${page.icon}"></i>
      </span>
      <div>
        <h1 class="fw-bold" th:text="${page.title}">Tiêu đề</h1>
        <p class="mb-0 mt-2" style="color: #CBD5E1; max-width: 720px;" th:text="${page.intro}">Giới thiệu</p>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="pro-card p-2 nx-page-nav" style="position: sticky; top: 110px;">
        <a th:each="p : ${pages}" th:href="@{/thong-tin/{s}(s=${p.slug})}"
           th:classappend="${p.slug == activeSlug} ? 'active'">
          <i class="bi" th:classappend="${p.icon}"></i><span th:text="${p.title}">Mục</span>
        </a>
      </div>
    </aside>

    <section class="col-lg-9">
      <div class="pro-card p-4 p-md-5 nx-prose">
        <div th:each="s, st : ${page.sections}">
          <h4 th:text="${s.heading}" th:classappend="${st.first} ? 'mt-0'">Mục</h4>
          <p th:each="para : ${s.paragraphs}" th:text="${para}">Nội dung</p>
          <ul th:if="${!s.bullets.isEmpty()}">
            <li th:each="b : ${s.bullets}" th:text="${b}">Ý</li>
          </ul>
        </div>

        <div class="mt-4 p-3 rounded-4 d-flex flex-wrap align-items-center justify-content-between gap-2"
             style="background: var(--brand-primary-soft); border: 1px solid #BFDBFE;">
          <div class="small"><strong>Cần thêm hỗ trợ?</strong> Gọi hotline
            <a th:href="'tel:' + ${#strings.replace(shop.phone, ' ', '')}" class="fw-bold text-decoration-none" th:text="${shop.phone}">0901 234 567</a>
            trong giờ làm việc.</div>
          <a th:href="@{/}" class="btn btn-pv-primary btn-sm px-3"><i class="bi bi-bag me-1"></i>Tiếp tục mua sắm</a>
        </div>
      </div>
    </section>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
