<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead(${page.title})}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4 py-md-5">
  <nav aria-label="breadcrumb" class="mb-3 small">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
      <li class="breadcrumb-item active" th:text="${page.title}">Thông tin</li>
    </ol>
  </nav>

  <div class="nx-hero mb-4">
    <div class="d-flex align-items-center gap-3">
      <span class="pro-avatar-circle" style="width: 56px; height: 56px; font-size: 1.6rem;">
        <i class="bi" th:classappend="${page.icon}"></i>
      </span>
      <div>
        <h1 class="h3 fw-bold mb-1" th:text="${page.title}">Tiêu đề</h1>
        <p class="mb-0 opacity-75 small" th:text="${page.intro}">Giới thiệu</p>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="nx-filter-bar p-2 d-flex flex-column gap-1">
        <a th:each="p : ${pages}" th:href="@{/thong-tin/{s}(s=${p.slug})}"
           class="px-3 py-2 rounded-3 small fw-semibold"
           th:classappend="${p.slug == activeSlug} ? 'bg-primary text-white' : 'text-reset'">
          <i class="bi me-2" th:classappend="${p.icon}"></i><span th:text="${p.title}"></span>
        </a>
      </div>
    </aside>
    <section class="col-lg-9">
      <div class="nx-filter-bar p-4 p-md-5">
        <div th:each="s, st : ${page.sections}" th:classappend="${!st.first} ? 'mt-4 pt-3 border-top'">
          <h5 class="fw-bold mb-2" th:text="${s.heading}"></h5>
          <p class="text-muted small" th:each="para : ${s.paragraphs}" th:text="${para}"></p>
          <ul class="small mb-0" th:if="${!s.bullets.isEmpty()}">
            <li class="mb-1" th:each="b : ${s.bullets}" th:text="${b}"></li>
          </ul>
        </div>
      </div>
    </section>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
