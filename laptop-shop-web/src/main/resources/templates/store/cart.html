<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Giỏ hàng')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4">
  <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

  <h2 class="fw-bold mb-4"><i class="bi bi-cart3 text-primary me-2"></i>Giỏ hàng của bạn</h2>

  <div th:if="${items.empty}" class="nx-filter-bar text-center py-5">
    <i class="bi bi-cart-x display-3 text-muted mb-3 d-block"></i>
    <h5 class="fw-bold">Giỏ hàng đang trống</h5>
    <p class="text-muted small mb-4">Hãy khám phá các dòng laptop mới nhất và thêm vào giỏ nhé.</p>
    <a th:href="@{/}" class="btn btn-pv-primary px-4">Tiếp tục mua sắm</a>
  </div>

  <div class="row g-4" th:if="${!items.empty}">
    <div class="col-lg-8">
      <div class="nx-filter-bar p-0 overflow-hidden">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Sản phẩm</th>
                <th class="text-end">Đơn giá</th>
                <th class="text-center">Số lượng</th>
                <th class="text-end">Thành tiền</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${items}">
                <td>
                  <div class="d-flex align-items-center gap-3">
                    <img th:src="${item.laptop.displayImageUrl}" alt="" style="width: 64px; height: 48px; object-fit: contain; background: #fff; border-radius: 8px; padding: 3px;"/>
                    <div>
                      <a th:href="@{/san-pham/{id}(id=${item.laptop.id})}" class="fw-bold text-reset d-block" th:text="${item.laptop.name}"></a>
                      <small class="text-muted font-mono-code" th:text="${item.laptop.sku}"></small>
                    </div>
                  </div>
                </td>
                <td class="text-end tabular-nums" th:text="${#numbers.formatDecimal(item.laptop.salePrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                <td class="text-center" style="width: 150px;">
                  <form th:action="@{/gio-hang/cap-nhat/{id}(id=${item.laptop.id})}" method="post" class="d-flex justify-content-center gap-1">
                    <input type="number" name="quantity" th:value="${item.quantity}" min="1" th:max="${item.laptop.stockQuantity}"
                           class="form-control form-control-sm text-center" style="width: 64px;"/>
                    <button type="submit" class="btn btn-outline-primary btn-sm" title="Cập nhật"><i class="bi bi-check2"></i></button>
                  </form>
                </td>
                <td class="text-end fw-bold text-primary tabular-nums" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                <td class="text-end">
                  <form th:action="@{/gio-hang/xoa/{id}(id=${item.laptop.id})}" method="post" data-confirm="Xóa sản phẩm này khỏi giỏ hàng?">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="nx-filter-bar p-4 sticky-lg-top" style="top: 96px;">
        <h5 class="fw-bold mb-3">Tóm tắt đơn hàng</h5>
        <div class="d-flex justify-content-between small mb-2">
          <span class="text-muted">Tạm tính</span>
          <strong class="tabular-nums" th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></strong>
        </div>
        <div class="d-flex justify-content-between small mb-3">
          <span class="text-muted">Phí vận chuyển dự kiến</span>
          <strong th:text="${estimatedShipping.signum() == 0 ? 'Miễn phí' : #numbers.formatDecimal(estimatedShipping, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></strong>
        </div>
        <div class="alert alert-info py-2 small rounded-3 mb-3" th:if="${estimatedShipping.signum() == 0}">
          <i class="bi bi-truck me-1"></i>Đơn hàng của bạn được <strong>miễn phí giao hàng toàn quốc!</strong>
        </div>
        <a th:href="@{/dat-hang}" class="btn btn-pv-primary w-100 py-2 fw-bold">
          Tiến hành đặt hàng <i class="bi bi-arrow-right ms-1"></i>
        </a>
        <a th:href="@{/}" class="btn btn-outline-secondary w-100 mt-2">Tiếp tục mua sắm</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
