<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giỏ hàng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments/header :: header}"></div>
<div class="container py-5"><h2>Giỏ hàng của bạn</h2><div th:if="${#lists.isEmpty(items)}">Giỏ hàng đang trống. <a th:href="@{/}">Mua sắm ngay</a></div>
<div class="table-responsive" th:if="${!#lists.isEmpty(items)}"><table class="table align-middle"><thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Tạm tính</th><th></th></tr></thead><tbody>
<tr th:each="item : ${items}"><td th:text="${item.product.name}"></td><td th:text="${item.product.price}"></td><td th:text="${item.quantity}"></td><td th:text="${item.amount}"></td><td><form th:action="@{/gio-hang/xoa/{id}(id=${item.product.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr>
</tbody></table><h4 class="text-end">Tổng tiền: <span th:text="${total}"></span> đ</h4><form class="text-end" th:action="@{/dat-hang}" method="post"><button class="btn btn-success">Đặt hàng</button></form></div></div></body></html>
