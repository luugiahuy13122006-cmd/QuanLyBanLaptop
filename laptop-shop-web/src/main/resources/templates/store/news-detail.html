<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead(${article.title})}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4 py-md-5" style="max-width: 860px;">
  <a th:href="@{/tin-tuc}" class="small d-inline-block mb-3"><i class="bi bi-arrow-left me-1"></i>Quay lại Tin công nghệ</a>
  <article class="nx-filter-bar p-4 p-md-5">
    <h1 class="h2 fw-bold mb-2" th:text="${article.title}">Tiêu đề</h1>
    <div class="small text-muted mb-4" th:text="${article.author + ' · ' + #temporals.format(article.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
    <img th:if="${article.coverImage != null}" th:src="${article.coverImage}" alt="" class="img-fluid rounded-4 mb-4"/>
    <p class="lead fs-6 fw-semibold" th:text="${article.summary}"></p>
    <div style="white-space: pre-line;" th:text="${article.content}"></div>
  </article>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
