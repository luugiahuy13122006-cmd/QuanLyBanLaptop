<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaptopShop - Trang chủ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/header :: header}"></div><main class="container py-4">
<h2 class="mb-3" th:text="${keyword != null ? 'Kết quả tìm kiếm: ' + keyword : 'Laptop nổi bật'}">Laptop nổi bật</h2>
<div class="row g-4" th:if="${!#lists.isEmpty(products)}"><div class="col-12 col-sm-6 col-lg-3" th:each="p : ${products}">
<div class="card h-100 shadow-sm"><img class="card-img-top product-img" th:src="${p.imageUrl}" th:alt="${p.name}">
<div class="card-body d-flex flex-column"><h5 class="card-title" th:text="${p.name}">Tên laptop</h5>
<p class="text-danger fw-bold" th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + ' đ'">Giá</p>
<a class="btn btn-outline-primary mt-auto" th:href="@{/san-pham/{id}(id=${p.id})}">Xem chi tiết</a></div></div></div></div>
<p th:if="${#lists.isEmpty(products)}">Chưa có sản phẩm phù hợp.</p></main></body></html>
