<!DOCTYPE html>
<!-- Thành viên phụ trách: TV3 - Trương Xuân Đạt -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đặt hàng thành công - LaptopShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
  <div class="bg-white rounded-3 border shadow-sm mx-auto p-4 p-md-5 text-center" style="max-width: 720px;">
    <i class="bi bi-check-circle-fill text-success display-3 mb-3 d-block"></i>
    <h2 class="fw-bold text-success mb-2">Đặt hàng thành công!</h2>
    <p class="text-muted mb-4">Đơn hàng của bạn đã được lưu vào CSDL và trừ tồn kho an toàn bằng Pessimistic Lock.</p>

    <div class="bg-light rounded p-3 text-start mb-4 border">
      <div class="row g-2 small">
        <div class="col-sm-6"><strong>Mã đơn hàng:</strong> <code class="fs-6" th:text="${order.orderCode}"></code></div>
        <div class="col-sm-6"><strong>Trạng thái:</strong> <span class="badge bg-warning text-dark" th:text="${order.status.displayName}"></span></div>
        <div class="col-sm-6"><strong>Người nhận:</strong> <span th:text="${order.recipientName}"></span></div>
        <div class="col-sm-6"><strong>SĐT:</strong> <span th:text="${order.recipientPhone}"></span></div>
        <div class="col-12"><strong>Địa chỉ giao:</strong> <span th:text="${order.deliveryAddress}"></span></div>
        <div class="col-sm-6" th:if="${payment != null}"><strong>Thanh toán:</strong> <span th:text="${payment.paymentMethod.displayName}"></span></div>
        <div class="col-sm-6"><strong>Tổng thanh toán:</strong> <strong class="pv-price" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></strong></div>
      </div>
    </div>

    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <a th:href="@{/}" class="btn btn-pv-primary px-4"><i class="bi bi-house me-1"></i>Về trang chủ</a>
      <a th:href="@{/don-hang-cua-toi}" class="btn btn-pv-outline px-4"><i class="bi bi-bag-check me-1"></i>Xem đơn hàng của tôi</a>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
