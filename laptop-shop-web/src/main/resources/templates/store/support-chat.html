<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head :: commonHead('Hỗ trợ trực tuyến')}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="mainContent" class="container py-4 py-md-5" style="max-width: 900px;">
  <h2 class="fw-bold mb-3"><i class="bi bi-chat-dots text-primary me-2"></i>Hỗ trợ trực tuyến với tư vấn viên NEXORA</h2>

  <div class="nx-filter-bar p-4 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-2 small text-muted">
      <span>Mã phòng hỗ trợ: <code th:text="${roomKey}"></code></span>
      <span class="text-success fw-semibold"><i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>Đang trực tuyến</span>
    </div>

    <div id="nxChatThread" class="nx-chat-thread mb-3">
      <div th:each="m : ${messages}" class="nx-chat-bubble"
           th:classappend="${m.senderRole == 'CUSTOMER'} ? 'is-customer' : 'is-staff'">
        <div class="small fw-bold opacity-75" th:text="${m.senderName}"></div>
        <div th:text="${m.content}"></div>
      </div>
    </div>

    <form id="nxChatForm" class="d-flex gap-2">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" id="nxChatCsrf"/>
      <input type="text" id="nxChatInput" class="form-control" placeholder="Nhập câu hỏi tư vấn cấu hình, đơn hàng, bảo hành..." required/>
      <button type="submit" class="btn btn-pv-primary px-4">Gửi</button>
    </form>
  </div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('nxChatForm');
    const input = document.getElementById('nxChatInput');
    const thread = document.getElementById('nxChatThread');
    const csrf = document.getElementById('nxChatCsrf');

    function refreshChat() {
      fetch('/api/chat/messages')
        .then(r => r.json())
        .then(list => {
          thread.innerHTML = list.map(m =>
            '<div class="nx-chat-bubble ' + (m.senderRole === 'CUSTOMER' ? 'is-customer' : 'is-staff') + '">' +
            '<div class="small fw-bold opacity-75">' + m.senderName + '</div>' +
            '<div>' + m.content + '</div></div>'
          ).join('');
          thread.scrollTop = thread.scrollHeight;
        }).catch(() => {});
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const body = new URLSearchParams({ content: text });
      body.append(csrf.name, csrf.value);
      fetch('/api/chat/send', { method: 'POST', body: body })
        .then(r => { if (r.ok) { input.value = ''; refreshChat(); } });
    });
    setInterval(refreshChat, 3500);
  });
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/scripts :: commonScripts}"/>
</body>
</html>
