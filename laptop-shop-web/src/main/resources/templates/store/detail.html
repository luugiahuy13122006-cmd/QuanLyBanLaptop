<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết sản phẩm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/header :: header}"></div>
<div class="container py-5"><a th:href="@{/}" class="text-decoration-none">← Trang chủ</a><div class="row mt-3 g-4"><div class="col-md-6"><img class="img-fluid rounded" th:src="${product.imageUrl}" th:alt="${product.name}"></div>
<div class="col-md-6"><h2 th:text="${product.name}">Tên laptop</h2><h4 class="text-danger my-3" th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT')} + ' đ'"></h4>
<p th:text="${product.description}"></p><p>Còn hàng: <span th:text="${product.stock}"></span></p>
<form th:action="@{/gio-hang/them/{id}(id=${product.id})}" method="post"><button class="btn btn-primary">Thêm vào giỏ hàng</button></form></div></div></div></body></html>
