<!DOCTYPE html>
<!-- Thành viên phụ trách: TV3 - Trương Xuân Đạt & TV4 - Nguyễn Tuấn Khang -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đơn hàng của tôi - LaptopShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">
  <h2 class="h4 fw-bold mb-3"><i class="bi bi-bag-check me-2" style="color: var(--pv-blue);"></i>Lịch sử đơn hàng của tôi</h2>
  <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

  <div th:if="${#lists.isEmpty(orders)}" class="bg-white rounded-3 border p-4 text-center">
    <p class="text-muted mb-3">Bạn chưa có đơn hàng nào.</p>
    <a th:href="@{/}" class="btn btn-pv-primary">Mua sắm ngay</a>
  </div>

  <div class="bg-white rounded-3 border shadow-sm overflow-hidden" th:if="${!#lists.isEmpty(orders)}">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Mã đơn</th>
            <th>Ngày đặt</th>
            <th>Sản phẩm</th>
            <th class="text-end">Tổng tiền</th>
            <th class="text-center">Trạng thái</th>
            <th class="text-center">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="o : ${orders}">
            <td class="fw-bold" style="color: var(--pv-blue);" th:text="${o.orderCode}"></td>
            <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <div th:each="d : ${o.details}" class="small">
                <span th:text="${d.laptopNameSnapshot}"></span> x <strong th:text="${d.quantity}"></strong>
              </div>
            </td>
            <td class="text-end pv-price"
                th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
            <td class="text-center">
              <span class="badge"
                    th:classappend="${o.status.name() == 'COMPLETED' ? 'bg-success' : (o.status.name() == 'CANCELLED' or o.status.name() == 'RETURNED' ? 'bg-danger' : 'bg-warning text-dark')}"
                    th:text="${o.status.displayName}"></span>
            </td>
            <td class="text-center">
              <form th:if="${o.status.name() == 'PENDING'}"
                    th:action="@{/don-hang-cua-toi/{id}/huy(id=${o.id})}" method="post"
                    onsubmit="return confirm('Bạn có chắc muốn hủy đơn hàng này?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">Hủy đơn</button>
              </form>
              <span th:unless="${o.status.name() == 'PENDING'}" class="text-muted small">-</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
