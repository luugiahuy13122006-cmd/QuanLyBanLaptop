<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('Đơn hàng của tôi')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="h4 fw-bold mb-0"><i class="bi bi-bag-check text-primary me-2"></i>Lịch sử đơn hàng của tôi</h2>
    <a th:href="@{/}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Tiếp tục mua sắm</a>
  </div>
  <div th:replace="~{fragments/admin-layout :: flashMessages}"></div>

  <div th:if="${#lists.isEmpty(orders)}" class="pro-card p-5 text-center">
    <h5 class="fw-bold mb-1">Chưa có đơn hàng nào</h5>
    <p class="text-muted small mb-3">Bạn chưa đặt đơn hàng nào.</p>
    <a th:href="@{/}" class="btn btn-pv-primary px-4">Mua sắm ngay</a>
  </div>

  <div class="pro-card" th:if="${!#lists.isEmpty(orders)}">
    <div class="table-responsive">
      <table class="table pro-table align-middle mb-0">
        <thead>
          <tr><th>Mã đơn</th><th>Ngày đặt</th><th>Sản phẩm</th><th class="text-end">Tổng tiền</th><th class="text-center">Trạng thái</th><th class="text-center">Thao tác</th></tr>
        </thead>
        <tbody>
          <tr th:each="o : ${orders}">
            <td><code class="fw-bold text-primary" th:text="${o.orderCode}"></code></td>
            <td class="small text-muted tabular-nums" th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <div th:each="d : ${o.details}" class="small">
                <span th:text="${d.laptopNameSnapshot}"></span> x <strong th:text="${d.quantity}"></strong>
              </div>
            </td>
            <td class="text-end pv-price tabular-nums text-nowrap"
                th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
            <td class="text-center"><span class="badge-soft badge-soft-info" th:text="${o.status.displayName}"></span></td>
            <td class="text-center">
              <a th:href="@{/don-hang-cua-toi/{id}(id=${o.id})}" class="btn btn-sm btn-pv-outline">Chi tiết</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: commonScripts}"></div>
</body>
</html>
