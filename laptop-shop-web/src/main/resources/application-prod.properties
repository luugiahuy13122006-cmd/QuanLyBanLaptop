# =====================================================================
# PROFILE VẬN HÀNH THẬT (PRODUCTION)
# Bắt buộc thiết lập: DB_USERNAME, DB_PASSWORD, QR_HMAC_SECRET,
# PAYMENT_WEBHOOK_SECRET, SOCKET_AUTH_TOKEN qua biến môi trường.
# =====================================================================
spring.thymeleaf.cache=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Không lộ thông tin lỗi kỹ thuật ra client
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Cookie Secure khi chạy sau HTTPS reverse proxy
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# Production thanh toán thật: bắt buộc Webhook hoặc STAFF/ADMIN duyệt thủ công
laptop.payment.mode=${PAYMENT_MODE:PRODUCTION}
laptop.qr.tunnel-enabled=false
