# =====================================================================
# PROFILE PHÁT TRIỂN (DEV)
# =====================================================================
spring.thymeleaf.cache=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
server.error.include-stacktrace=never

# Dev mặc định bật tunnel nếu không override và dùng chế độ thanh toán DEMO
laptop.payment.mode=${PAYMENT_MODE:DEMO}
laptop.qr.tunnel-enabled=${QR_TUNNEL_ENABLED:true}
laptop.qr.hmac-secret=${QR_HMAC_SECRET:NEXORA_DEV_ONLY_HMAC_SECRET_2026_DO_NOT_USE_IN_PROD}
laptop.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:NEXORA_DEV_WEBHOOK_SECRET_2026}
laptop.socket.auth-token=${SOCKET_AUTH_TOKEN:NEXORA_SOCKET_DEV_TOKEN_2026}

# Dev database fallback (chỉ dùng qua env hoặc sửa file local nếu chạy IDE không set env)
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
