# Cấu hình kiểm thử tự động JUnit 5 (H2 giả lập SQL Server - chạy không cần cài SQL Server)
spring.datasource.url=jdbc:h2:mem:ql_laptop_test;MODE=MSSQLServer;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false
laptop.socket.enabled=false
spring.task.scheduling.enabled=false
laptop.qr.tunnel-enabled=false
