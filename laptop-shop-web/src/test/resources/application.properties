# Cấu hình kiểm thử tự động JUnit 5 & Đa luồng (Concurrency) cho TV4 (H2 chế độ MSSQLServer)
spring.datasource.url=jdbc:h2:mem:ql_laptop_tv4;MODE=MSSQLServer;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
